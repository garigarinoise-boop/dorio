const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.salt),iterations:D.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.data));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
const K="dorio_sim_pw";let saved=null;try{saved=localStorage.getItem(K);}catch(e){}
const go=async()=>{const pw=document.getElementById("pw").value;const keep=document.getElementById("keep").checked;const err=document.getElementById("err");err.textContent="確認中…";
  try{await open_(pw);try{if(keep)localStorage.setItem(K,pw);}catch(e){}}
  catch(e){err.textContent="パスワードが違います（または、このブラウザが対応していません）";}};
document.getElementById("go").onclick=go;document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
if(saved){open_(saved).then(()=>{try{localStorage.setItem(K,saved)}catch(e){}}).catch(()=>{try{localStorage.removeItem(K)}catch(e){}});}
})();
