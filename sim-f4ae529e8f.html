<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ドリオ試合シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#ffffff; --panel-2:#f4f6f3; --ink:#17211c; --ink-soft:#55605a;
  --line:#d3dad3; --line-strong:#b7c1b8; --accent:#c81e2b; --navy:#0d3a6b; --gold:#c8891a;
  --ok:#1f7a4d; --warn:#b26a00; --ng:#c81e2b; --meet:#1d6fb8; --power:#c2410c;
  --hl:#fff4d6; --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.06); --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1418; --panel:#131e23; --panel-2:#0f171b; --ink:#e7ede9; --ink-soft:#93a29b;
  --line:#243138; --line-strong:#33454d; --accent:#e5424c; --navy:#3f7bd0; --gold:#e3a83c;
  --ok:#4fb381; --warn:#d69336; --ng:#e5424c; --meet:#5aa7ee; --power:#f08a4b; --hl:#2b2612;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0c1418; --panel:#131e23; --panel-2:#0f171b; --ink:#e7ede9; --ink-soft:#93a29b;
  --line:#243138; --line-strong:#33454d; --accent:#e5424c; --navy:#3f7bd0; --gold:#e3a83c;
  --ok:#4fb381; --warn:#d69336; --ng:#e5424c; --meet:#5aa7ee; --power:#f08a4b; --hl:#2b2612;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:14px;line-height:1.55}
.num,.mono{font-family:Oswald,"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
header{background:var(--navy);color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.loaders{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.loaders{grid-template-columns:1fr}}
.loader h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft)}
.tag.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.b{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:84px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--ink-soft)}
.small{font-size:12px}
.status{font-size:12px;color:var(--ink-soft);min-height:18px;margin-top:6px}
.status.err{color:var(--ng)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.recent button{font-size:12px;padding:3px 9px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabs button{border:none;border-radius:8px 8px 0 0;background:transparent;padding:8px 13px;color:var(--ink-soft);font-weight:700}
.tabs button.on{background:var(--panel);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-soft);font-weight:700;background:var(--panel-2);white-space:nowrap}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:700px}
.cname{white-space:nowrap}
.cname{cursor:pointer;border-bottom:1px dotted var(--line-strong)}
.cname:hover{color:var(--accent)}
.meet{color:var(--meet);font-weight:700}
.power{color:var(--power);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.ng{color:var(--ng);font-weight:700}
.warnc{color:var(--warn);font-weight:700}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-left:4px;border:1px solid var(--line-strong);color:var(--ink-soft);white-space:nowrap}
.badge.pin{border-color:var(--warn);color:var(--warn)}
.badge.awk{border-color:var(--gold);color:var(--gold)}
.hl{background:var(--hl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.stat .k{font-size:12px;color:var(--ink-soft)}
.stat .v{font-size:22px;font-weight:600}
.stat .v small{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:4px}
h3{font-size:15px;margin:16px 0 8px}
h3:first-child{margin-top:0}
.note{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.pct{display:inline-flex;align-items:center;min-width:92px}
.cond{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--panel-2)}
.cond .t{font-weight:700}
.cond .s{font-size:12px;color:var(--ink-soft);margin-top:3px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{padding:0 8px;line-height:22px;font-weight:700}
.chg-up{color:var(--ok);font-weight:700}
.chg-down{color:var(--ng);font-weight:700}
.diffcell{font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:560px){#modal .box{grid-template-columns:1fr}}
#modal img{width:100%;border-radius:8px;background:var(--panel-2)}
.effect{white-space:pre-wrap;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.searchres{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.searchres div{padding:5px 9px;border-bottom:1px solid var(--line);cursor:pointer}
.searchres div:hover{background:var(--panel-2)}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.toggle button{border:none;border-radius:0;padding:4px 10px}
.toggle button.on{background:var(--navy);color:#fff}
.foot{font-size:12px;color:var(--ink-soft);margin-top:20px}
</style>
</head>
<body>
<style>
.hand{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{text-align:left;min-width:120px;padding:5px 9px;line-height:1.35}
.chip.on{outline:3px solid var(--accent);background:var(--hl)}
.chip.dis{opacity:.45}
</style>
<header>
  <h1>ドリオ試合シミュレーター</h1>
  <div class="sub" id="dbinfo"></div>
</header>
<main>
  <p class="panel small" style="padding:9px 14px;margin-bottom:14px"><b>限られた人だけで使っているツールです。ファイルや URL をほかの人に渡したり、SNS に載せたりしないでください。</b>非公式のファンツールで、カードの権利は各権利者に帰属します。</p>
  <div class="loaders">
    <section class="panel loader" data-slot="A">
      <h2><span class="tag a">自分</span>自分のデッキ</h2>
      <div class="row"><input type="text" class="code" placeholder="DeckLogのデッキコード（例 KM6W8）" style="flex:1;min-width:160px"><button class="primary load">読み込む</button></div>
      <details class="small" style="margin-top:6px"><summary>文字で入力する（対戦卓のデッキ文字と同じ形）</summary>
        <textarea class="text"></textarea><button class="loadtext">この文字で読み込む</button></details>
      <div class="status"></div><div class="recent"></div>
    </section>
    <section class="panel loader" data-slot="B">
      <h2><span class="tag b">仮想敵</span>当たりそうな相手のデッキ</h2>
      <div class="row"><input type="text" class="code" placeholder="DeckLogのデッキコード（例 1Q9G52）" style="flex:1;min-width:160px"><button class="primary load">読み込む</button></div>
      <details class="small" style="margin-top:6px"><summary>文字で入力する</summary>
        <textarea class="text"></textarea><button class="loadtext">この文字で読み込む</button></details>
      <div class="status"></div><div class="recent"></div>
    </section>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view" class="panel"></div>
  <p class="foot">カードのデータ：DeckLog と公式カードリスト。チームカードの効果は公式のカード画像から書き起こし。数字はシミュレーションによる目安です。</p>
</main>
<script>
/**
 * ドリオ構築アナライザー：分析の本体（ブラウザ・GAS・Node のどれでも動く。外部アクセスはしない）
 * 入力: デッキ（DeckLog の JSON か、対戦卓と同じ文字形式）と、カード番号 → カード情報 の辞書
 * 出力: ルールチェック・サマリー・打順表・攻守2役表・シナジー・TP収支・引ける確率・比較
 * 点数は付けない。ルールと数字で一意に決まる事実だけを並べ、評価はユーザーが行う。
 */

var POS_NAME = { 1: '投手', 2: '捕手', 3: '一塁手', 4: '二塁手', 5: '三塁手', 6: '遊撃手', 7: '外野手', 100: 'ZONE' };
var POS_SHORT = { 1: '投', 2: '捕', 3: '一', 4: '二', 5: '三', 6: '遊', 7: '外', 100: 'Z' };
var TEAM_CODE = { T: '阪神', DB: 'DeNA', G: '巨人', D: '中日', C: '広島', S: 'ヤクルト', H: 'ソフトバンク', F: '日本ハム', B: 'オリックス', E: '楽天', L: '西武', M: 'ロッテ' };
var TEAM_NICK = { タイガース: 'T', ベイスターズ: 'DB', ジャイアンツ: 'G', ドラゴンズ: 'D', カープ: 'C', スワローズ: 'S', ホークス: 'H', ファイターズ: 'F', バファローズ: 'B', イーグルス: 'E', ライオンズ: 'L', マリーンズ: 'M' };
var CIRCLED = { '⓪': 0, '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5, '⑥': 6, '⑦': 7, '⑧': 8, '⑨': 9, '⑩': 10 };
var TP_START = 3; // 公式プレイガイド「タイムポイント 3つ」
// 公式チームカードの打撃判定表（全球団共通。2d6＋補正の合計）
var JUDGE = {
  ミート: function (t) { return t <= 4 ? 'アウト' : t <= 10 ? '単打' : '二塁打'; },
  強振: function (t) { return t <= 6 ? 'アウト' : t === 7 ? '単打' : t <= 10 ? '二塁打' : '本塁打'; },
};

// 「4以上」の中で正確な値が分かっている戦術カード（公式カード画像で確認済み）
// チームカードの効果（DeckLog・公式カードリストに文字が無いので、公式のカード画像から書き起こしたもの。2026-10-14 時点で全球団）
var TEAM_FX = {
  'TEAM-B03': { text: '【攻撃】自分のレストエリアに「フルスイング」が2枚以上あり、打撃判定を行うなら、ダイス+1する。【攻守】リフレッシュする際、レストエリアの「フルスイング」を3枚までレストエリアに残してもよい。', dice: [{ n: 1, restName: 'フルスイング', restMin: 2 }], keep: { name: 'フルスイング', n: 3 } },
  'TEAM-DB03': { text: '【攻撃】1つ前の勝負で、自分の打者が出塁していて、打撃判定を行うなら、ダイス+1する。', dice: [{ n: 1, prevOnBase: true }] },
  'TEAM-M04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-S03': { text: '試合の開始前、先攻と後攻を決める際、自分が決めることができる。（相手が同じチームカードなら、この能力は使えない。）', dice: [], chooseOrder: true },
  'TEAM-G04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-S04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-B04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-C04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-D04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-DB04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-E04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-F04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-H04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-L04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-T04': { text: '【攻撃】自分の出場している選手がZONE状態になった時、カードを1枚引く。', dice: [], zoneDraw: 1 },
  'TEAM-C03': { text: '（能力なし）', dice: [] },
  'TEAM-E03': { text: '【守備】自分が【本領発揮】を持つ選手カードをプレイした時、コストがそのカード以上で同じカード名の選手カードが出場しているなら、その【本領発揮】を有効にする。', dice: [], honByName: true },
  'TEAM-H03': { text: '試合開始時、タイムポイントを1つ多く持つ（上限6）。', dice: [], startTp: 1 },
  'TEAM-T03': { text: '【攻守】【勝負中①】自分が覚醒した時、1枚引いてもよい。そうしたら手札を1枚捨てる。', dice: [], awakenLoot: true },
};
var DP_EXACT = { 'PDO-04': 5, 'PDO-05': 5, 'PDO-12': 4 };
function dpValue_(c) { if (c.no in DP_EXACT) return DP_EXACT[c.no]; return c.dpSup === '4+' ? 4 : Number(c.dpSup) || 0; }

function normName_(s) { return String(s || '').replace(/[\s　]/g, ''); }
function teamOf_(no) { var m = String(no).match(/^[A-Z]+\d*-(DB|[A-Z])\d+/); return m ? m[1] : ''; }
function isFielder_(c) { return c && c.kind === '選手' && c.pos >= 2 && c.pos <= 7; }

/** 基礎能力の文字（【先発⑧】【強振①】【代打⓪】など）を読む */
function parseBase_(base) {
  var out = { starter: null, relief: null, closer: null, pinch: null, dice: {} };
  var re = /【(先発|中継ぎ|抑え|代打|ミート|強振)([⓪①-⑩]|\+?\d+)】/g, m;
  var s = String(base || '');
  while ((m = re.exec(s))) {
    var n = m[2] in CIRCLED ? CIRCLED[m[2]] : Number(String(m[2]).replace('+', ''));
    if (m[1] === 'ミート' || m[1] === '強振') out.dice[m[1]] = n;
    else out[{ 先発: 'starter', 中継ぎ: 'relief', 抑え: 'closer', 代打: 'pinch' }[m[1]]] = n;
  }
  return out;
}

/** 効果テキストを能力ごとに分ける（【攻撃】【守備】【攻・守】＜攻撃＞などの区切り、／） */
var ABIL_CACHE_ = {};
function abilities_(eff) {
  var key = String(eff || ''), hit = ABIL_CACHE_[key];
  if (hit) return hit.slice();
  // 全角の「＋」「－」で書かれた効果もあるので、半角にそろえてから読む（塩見・村上など）
  return (ABIL_CACHE_[key] = abilities0_(key)).slice();
}
function abilities0_(eff) {
  return String(eff || '').replace(/[＋₊]/g, '+').replace(/－/g, '-').replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); }).split(/／|\n|(?=【(?:攻撃|守備|攻・守|攻\/守)】)|(?=＜(?:攻撃|守備|攻・守)＞)/).map(function (x) { return x.trim(); }).filter(Boolean);
}

/**
 * 効果テキストから「打撃判定を行うなら【ダイス】+N」を拾う。
 * supportOnly=false：打者本人の【攻撃】の能力（【サポート】以外）、true：手札から伏せる【サポート】の能力
 * 属性は直前の「ミート／強振で（打撃判定・勝負）を行うなら」から決める。書いてなければ両方。
 */
function diceFromEffect_(eff, supportOnly) {
  var out = [];
  abilities_(eff).forEach(function (ab) {
    if (!/【攻撃】|【攻・守】|【攻\/守】|＜攻撃＞|＜攻・守＞/.test(ab)) return;
    if (!!supportOnly !== MAIN_AREA_RE.test(ab)) return;
    var re = /【?ダイス】?\+(\d+)/g, m;
    while ((m = re.exec(ab))) {
      var before = ab.slice(0, m.index), am = before.match(/(ミート|強振)で(打撃判定|勝負)を行うなら[^。]*$/) || before.match(/(ミート|強振)で(打撃判定|勝負)[^。]*。?[^。]*$/);
      // 条件の文：能力の頭からダイス＋の文の終わりまで（長ければ後ろ側を残す）
      var endIdx = ab.indexOf('。', m.index); endIdx = endIdx < 0 ? ab.length : endIdx + 1;
      var cond = ab.slice(0, endIdx).replace(/^(【[^】]+】|＜[^＞]+＞)+/, '').trim();
      if (cond.length > 130) cond = '…' + cond.slice(-130);
      out.push({ n: +m[1], attr: am ? am[1] : '両方', cond: cond });
    }
  });
  return out;
}

// メインデッキのカードが手札から置かれて能力が働くエリア（サポート・イニング・レスト）
var MAIN_AREA_RE = /【(サポート|イニング|レスト)】/;

/**
 * 伏せたとき（【サポート】の能力）に足される AP/DP を拾う。
 * 前に「〜なら／〜時、／〜場合」が付かないものは無条件（属性に関係なくかかる）、付くものは条件つき。
 */
function supportStat_(eff, tagRe) {
  tagRe = tagRe || /【サポート】/;
  var r = { ap: 0, dp: 0, apCond: [], dpCond: [], apAlt: [], dpAlt: [] };
  abilities_(eff).forEach(function (ab) {
    var head = (ab.match(/^(?:【[^】]+】|＜[^＞]+＞|\s)+/) || [''])[0];
    if (!tagRe.test(head)) return;
    var body = ab.replace(/^(?:【[^】]+】|＜[^＞]+＞|\s)+/, '');
    var seen = { AP: false, DP: false };

      found.sort(function (x, y) { return x.at - y.at; });
      // 「《投手》か《捕手》」「「寺地」か"ビハインド時"…」のように「か／または」でつながる条件は1つにまとめる（どれか1枚でよい）
      var groups = [];

      groups.forEach(function (g) {

  // ---- TP 収支 ----
  var tpUse = [], tpGain = [];
  order.forEach(function (c) {

    if (t.length) tpUse.push({ name: c.name, what: '能力の使用（' + (e.match(/【タイム[①-⑩]】/g) || []).join('') + '）', tp: t.reduce(function (a, b2) { return a + b2; }, 0), per: '使うたび' });

/** 2つのデッキの違い（メインの枚数差・サマリー差・打順差） */
/**
 * 対戦表：攻撃側の打者×守備側の投手を、伏せ方の組み合わせごとに比べる（AP ≧ DP なら打撃判定、DP が上ならアウト）。

function matchupTable(atk, def) {
  var bats = atk.values.filter(function (v) { return v.t.kind === 'AP'; });
  var pits = def.values.filter(function (v) { return v.t.kind === 'DP'; });
  var rows = [];
  pits.forEach(function (p) {
    bats.forEach(function (b) {
      var sc = [];
      var push = function (label, A, D) {
        var na = !A || !D;
        sc.push({ label: label, na: na, ap: na ? null : A.v, dp: na ? null : D.v, ap0: na ? null : A.v0, dp0: na ? null : D.v0, hit: na ? null : A.v >= D.v, hit0: na ? null : A.v0 >= D.v0,
          an: na ? '' : A.cards + (A.cond.length ? '〔' + A.cond.join('／') + '〕' : ''), dn: na ? '' : D.cards + (D.cond.length ? '〔' + D.cond.join('／') + '〕' : '') });
      };
      var defKill = def.hasShobushi && def.hasIatsu ? '勝負師か威圧' : def.hasShobushi ? '勝負師' : def.hasIatsu ? '威圧' : '';
      ['ミート', '強振'].forEach(function (attr) {
        var B = b.t, P = p.t;
        push(attr + '：覚醒1枚 vs 覚醒1枚', B.awk1, P.awk1);
        push(attr + '：最大 vs 最大', B.max[attr], P.max[attr]);
        if (defKill) push(attr + '：覚醒＋1枚 vs ' + defKill + '＋1枚', B.shoHit[attr], P.shoUse[attr] && Object.assign({}, P.shoUse[attr], { cards: P.shoUse[attr].cards.replace('勝負師', defKill) }));
        if (atk.hasShobushi) push(attr + '：勝負師＋1枚 vs 覚醒＋1枚', B.shoUse[attr], P.shoHit[attr]);
      });
      rows.push({ bat: b.name, batNo: b.no, pit: p.name, pitNo: p.no, pitRole: p.role, sc: sc });
    });
  });
  return rows;
}

function compareDecks(a, b) {
  var rowsA = {}, rowsB = {};
  a.twoWay.concat(a.tactics).forEach(function (r) { rowsA[r.no] = r; });
  b.twoWay.concat(b.tactics).forEach(function (r) { rowsB[r.no] = r; });
  var nos = Object.keys(rowsA).concat(Object.keys(rowsB).filter(function (k) { return !(k in rowsA); }));
  var diff = nos.map(function (no) {

  var am = yield { type: 'mulligan', side: R.A, ctx: ctx };

  R.mulligan(R.B); if (R.B.mull) R.LG('CPU：開始時に ' + R.B.mull + ' 枚入れ替え');

  var T = { A: R.A, B: R.B }, order = ctx.aFirst ? ['A', 'B'] : ['B', 'A'], first = true;
  for (var inn = 1; inn <= 3; inn++) {
    for (var h = 0; h < 2; h++) {

      if (inn === 3 && h === 1 && atk.score > def.score) break;

}

/** 効果の対応表（デッキの全カードの能力が、シミュレーターで扱われるか） */
function simCoverage(X) {

async function fetchDeck(code) {
  code = (code || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{3,12}$/.test(code)) throw new Error("デッキコードの形式が違います");
  const r = await fetch(PROXY + "/" + encodeURIComponent(code));
  if (!r.ok) throw new Error("取得に失敗しました（" + r.status + "）");
  const j = await r.json();
  if (!j || !j.list) throw new Error("このコードのデッキが見つかりません");
  return j;
}

function mergeGame(acc, g, w) {
  if (!acc) return JSON.parse(JSON.stringify(g));

  ["aFirst", "bFirst"].forEach(k => { const na = k === "aFirst" ? acc.nF : acc.nS, ng = k === "aFirst" ? g.nF : g.nS; ["win", "draw", "lose", "runsA", "runsB"].forEach(q => { const t = (na || 0) + (ng || 0); acc[k][q] = t ? (((acc[k][q] || 0) * (na || 0)) + ((g[k][q] || 0) * (ng || 0))) / t : null; }); });
  ["innA", "innB"].forEach(k => acc[k] = acc[k].map((v, i) => mix(v, g[k][i])));

  for (const s in g.scores) acc.scores[s] = (acc.scores[s] || 0) + g.scores[s];
  if (g.innF) {
    ["innF", "innS"].forEach(k => ["A", "B"].forEach(t => acc[k][t] = acc[k][t].map((v, i) => v + g[k][t][i])));
    acc.nF += g.nF; acc.nS += g.nS;
    ["F", "S"].forEach(f => g.handHist[f].forEach((h, i) => { for (const n in h) acc.handHist[f][i][n] = (acc.handHist[f][i][n] || 0) + h[n]; }));
    ["A", "B"].forEach(t => ["use", "hit", "faced"].forEach(q => acc.kill[t][q] += g.kill[t][q]));
  }
  acc.trials = W; return acc;
}

      panel = `<h3>開始時の手札の入れ替え</h3><p class="small">レストに戻す札を選んでください（何枚でも。戻した札はリフレッシュまで戻りません）。</p>${handPick(99)}<button class="primary" data-act="ok">この札を戻して引き直す</button> <button data-act="none">入れ替えない</button>`; break;
    case "atkPre":
      panel = `<h3>${esc(q.batter.name)} の打席：${q.defN != null ? "代打を出すか" : "打席の前の操作"}</h3>${q.defN != null ? `<p class="small">相手はもう<b>${q.defN}枚</b>伏せています（中身は公開まで分かりません）。</p>` : ""}<div class="row">${q.zoneOk ? `<button class="primary" data-act="zone">ZONE（TP1）</button>` : ""}${q.pinch.map(p => `<button data-act="pinch" data-no="${esc(p.no)}">代打 ${esc(p.name)}（TP1）</button>`).join("")}<button data-act="none">何もしない</button></div>`; break;
    case "kidou": {
      const kd = q.kd;
      let how = "";
      const innPC = me.inning.some(x => x.kind === "選手" && (x.pos === 1 || x.pos === 2));
      if (kd.type === "inningPC") how = "イニングエリアに置く札を1枚選んでください。" + (innPC ? "イニングエリアにはもう投手か捕手があるので、どの札を置いても AP が上がります。" : "<b>今イニングエリアに投手・捕手が無いので、投手か捕手（印の付いた札）を置かないと AP は上がりません。</b>") + "置いた後、イニングエリアから1枚手札に戻せます（置いた札を戻してもかまいません）。";
      else if (kd.type === "cycle") how = `捨てる札を ${kd.n} 枚まで選んでください（同じ枚数引きます）。`;
      else if (kd.cost === "hand") how = "手札から捨てる札を1枚選んでください。" + (kd.needAttr ? `（サポートに${kd.needAttr}APを持つ札）` : "");
      const needPick = kd.type === "inningPC" || kd.type === "cycle" || kd.cost === "hand";
      if (kd.type === "choose") { panel = `<h3>${esc(q.batter.name)} の起動（1つ選ぶ）</h3><p class="small">${esc(q.text)}</p><div class="row">${kd.opts.map((o, i) => `<button class="primary" data-act="opt" data-i2="${i}">${esc(o.text)}</button>`).join("")}<button data-act="skip">使わない</button></div>`; break; }
      const pcMark = x => x.kind === "選手" && x.pos === 1 ? "投手" : x.kind === "選手" && x.pos === 2 ? "捕手" : "";
      if (!SO.extra.step || !needPick) panel = `<h3>${esc(q.batter.name)} の起動</h3><p class="small">${esc(q.text)}</p><button class="primary" data-act="${needPick ? "step" : "use"}">起動を使う${kd.tp ? "（TP1）" : ""}</button> <button data-act="skip">使わない</button>`;
      else panel = `<h3>${esc(q.batter.name)} の起動</h3><p class="small">${how}</p>${handPick(kd.type === "cycle" ? kd.n : 1, kd.type === "inningPC" ? { mark: pcMark } : null)}<button class="primary" data-act="use" ${SO.sel.length ? "" : "disabled"}>この札で決定</button> <button data-act="back">戻る</button>`; break;
    }
    case "zoneReveal":
      panel = `<h3>ZONE（${esc(q.batter.name)}）：山札の上から公開した ${q.cards.length} 枚</h3><p class="small">${q.cards.length} 枚のうち ${q.take} 枚を手札に加え、残りはレストに置きます。おすすめの ${q.take} 枚を選んだ状態にしてあります（押すと入れ替えられます）。</p><div class="hand">${q.cards.map((x, i) => chip(x, i)).join("")}</div><p class="small muted">選んだ札：${SO.sel.length} / ${q.take} 枚</p><button class="primary" data-act="ok">この札を手札に加える</button>`; break;
    case "revealPick":
      panel = `<h3>${esc(q.batter.name)} の起動：公開した ${q.cards.length} 枚</h3><p class="small">手札に加える札を ${q.take} 枚まで選んでください。残りはレストに置かれます。おすすめを選んだ状態にしてあります。</p><div class="hand">${q.cards.map((x, i) => chip(x, i)).join("")}</div><button class="primary" data-act="ok">この札を手札に加える</button>`; break;
    case "scry":
      panel = `<h3>山札の上から ${q.cards.length} 枚を見る</h3><p class="small">山札の上に残す札を選んでください（選んだ順に上から置きます）。選ばなかった札はレストに置かれます。</p><div class="hand">${q.cards.map((x, i) => chip(x, i, { mark: x2 => { const k = SO.sel.indexOf(q.cards.indexOf(x2)); return k >= 0 ? "上から" + (k + 1) + "枚目" : ""; } })).join("")}</div><button class="primary" data-act="ok">これで決定</button>`; break;
    case "takeBack":
      panel = `<h3>イニングエリアから手札に戻す札</h3><div class="hand">${q.inning.map((x, i) => chip(x, i)).join("")}</div><button class="primary" data-act="ok">この札を手札へ</button>`; break;
    case "atkSelect": {
      const pv = a => q.preview(SO.sel, a);
      panel = `<h3>${esc(q.batter.name)} の打席（相手投手 ${esc(q.pitcher.name)}：素の DP ミート ${q.pitDP["ミート"]}・強振 ${q.pitDP["強振"]}）${q.kidouOn ? ' <span class="badge">起動済み</span>' : ""}</h3>
      <p class="small">伏せる札を1〜${q.max || 2}枚選んで、宣言してください（手札があるときは必ず1枚以上。公式Q&A Q52）。相手はもう<b>${q.defN != null ? q.defN + "枚" : ""}</b>伏せています（中身は公開まで分かりません）。</p>${handPick(q.max || 2, { mark: awkMark(q.batter.no) })}
      <div class="row"><button class="primary" data-act="atk" data-a="ミート" ${SO.sel.length || !me.hand.length ? "" : "disabled"}>ミートで勝負（AP ${pv("ミート")}）</button><button class="primary" data-act="atk" data-a="強振" ${SO.sel.length || !me.hand.length ? "" : "disabled"} style="background:var(--power);border-color:var(--power)">強振で勝負（AP ${pv("強振")}）</button></div>`; break;
    }
    case "defPre":
      if (SO.extra.step === "swap") panel = `<h3>投手の起動：捨てる札を選ぶ</h3>${handPick(1)}<button class="primary" data-act="swap" ${SO.sel.length ? "" : "disabled"}>この札を捨てて引く</button> <button data-act="back">戻る</button>`;
      else panel = `<h3>${esc(q.batter.name)} の打席：守備の前の操作</h3><div class="row">${q.relief ? `<button class="primary" data-act="relief">継投 ${esc(q.relief.name)}（TP1）</button>` : ""}${q.swap ? `<button data-act="step" data-s="swap">投手の起動（捨てて引く）</button>` : ""}<button data-act="none">何もしない</button></div>`; break;
    case "defPlace": {
      const pv = a => q.preview(SO.sel, a);
      panel = `<h3>守備：${esc(q.batter.name)} に伏せる札</h3><p class="small">2枚まで選んでください。今の DP：<span class="meet">ミート ${pv("ミート")}</span>・<span class="power">強振 ${pv("強振")}</span>（中嶋などの「捨てて DP+」は、捨てられる札があれば含めた値）</p>
      ${handPick(2, { mark: awkMark(q.pitcher.no) })}<button class="primary" data-act="ok" ${SO.sel.length || !me.hand.length ? "" : "disabled"}>この札を伏せる</button>${me.hand.length ? `<p class="small muted">手札があるときは必ず1〜2枚置きます（公式Q&A Q52）。</p>` : ""}`; break;
    }
    case "honSwap":
      if (!SO.extra.step) { panel = `<h3>${esc(q.card.name)} の本領発揮：イニングエリアと手札を1枚ずつ入れ替えられます</h3><p class="small">イニングエリア：${q.inning.map(x => esc(x.name)).join("・")}</p><button class="primary" data-act="step">入れ替える</button> <button data-act="none">入れ替えない</button>`; break; }
      panel = `<h3>${esc(q.card.name)} の本領発揮：入れ替える札を選ぶ</h3><p class="small">イニングエリアから手札に戻す札</p><div class="hand" id="inn">${q.inning.map((x, i) => `<button class="chip${SO.extra.inIdx === i ? " on" : ""}" data-in="${i}"><b>${esc(x.name)}</b></button>`).join("")}</div><p class="small">手札からイニングエリアに置く札</p>${handPick(1)}<button class="primary" data-act="ok" ${SO.sel.length && SO.extra.inIdx != null ? "" : "disabled"}>この2枚で入れ替える</button> <button data-act="back">戻る</button>`; break;
    case "honDiscard":
      panel = `<h3>${esc(q.card.name)} の本領発揮</h3><p class="small">相手：${esc(q.attr)} AP <b>${q.ap}</b>　自分：今の DP <b>${q.dpNow}</b>（DP+${q.dp} なら ${q.dpNow + q.dp}。同じ値は打撃判定に入ります）</p><p class="small">手札を1枚捨てられます（コスト2以上の札なら効果が働きます）。</p>${SO.extra.step ? `<p class="small"><b>${SO.extra.step === "dp" ? "DP+" + q.dp : "1枚引く"}</b>：捨てる札を選んでください</p>${handPick(1, { mark: x => x.kind === "選手" && (x.cost || 0) >= 2 ? "コスト" + x.cost : "" })}<button class="primary" data-act="${SO.extra.step}" ${SO.sel.length ? "" : "disabled"}>この札を捨てる</button> <button data-act="back">戻る</button>` : `<button class="primary" data-act="step" data-s="dp">DP+${q.dp}</button> <button data-act="step" data-s="draw">1枚引く</button> <button data-act="none">使わない</button>`}`; break;
    case "discardPick":
      panel = `<h3>${esc(q.title)}</h3>${handPick(q.n)}<button class="primary" data-act="ok" ${SO.sel.length || q.optional ? "" : "disabled"}>${SO.sel.length ? "この札を捨てる" : "捨てない"}</button>${q.optional ? "" : `<p class="small muted">選ばずに進めることはできません。</p>`}`; break;
    case "pick":
      panel = `<h3>${esc(q.title)}</h3><div class="hand">${q.cards.map((x, i) => chip(x, i, { dis: q.ok ? (x2 => !q.ok[q.cards.indexOf(x2)]) : null, mark: q.ok ? (x2 => q.ok[q.cards.indexOf(x2)] ? "選べる" : "") : null })).join("")}</div><p class="small muted">選んだ札：${SO.sel.length} / ${q.take} 枚（おすすめを選んだ状態にしてあります）</p><button class="primary" data-act="ok">これで決定</button> <button data-act="none">選ばない</button>`; break;
    case "choice":
      panel = `<h3>${esc(q.title)}</h3><div class="row">${q.opts.map((o, i) => `<button class="primary" data-act="opt" data-i2="${i}">${esc(o)}</button>`).join("")}</div>`; break;
    case "payHand":
      panel = `<h3>${esc(q.card.name)}：手札を1枚捨てて効果を使う</h3><p class="small">${esc(q.text)}${q.extra ? "（" + esc(q.extra) + "）" : ""}</p>${handPick(1)}<button class="primary" data-act="ok" ${SO.sel.length ? "" : "disabled"}>この札を捨てて使う</button> <button data-act="none">使わない</button>`; break;
    case "inningPick":
      panel = `<h3>3アウト：イニングエリアに置く札</h3><div class="hand">${q.out.map((x, i) => chip(x, i)).join("")}</div><button class="primary" data-act="ok">この札を置く</button>`; break;
    case "inningSwap":
      panel = `<h3>${esc(q.pitcher.name)} の効果：イニングエリアとレストを1枚ずつ入れ替え</h3><p class="small">今のイニングエリア：${q.inning.map(x => esc(x.name)).join("・")}（入れ替えないと ${q.none} 枚引ける）</p>
      <div style="max-height:220px;overflow:auto">${q.options.map((o, i) => `<label class="small" style="display:block"><input type="radio" name="isw" value="${i}" ${SO.extra.opt === i ? "checked" : ""}> ${esc(o.label)}（引ける枚数 ${o.d}）</label>`).join("")}</div>
      <button class="primary" data-act="ok">入れ替える</button> <button data-act="none">入れ替えない</button>`; break;
    case "result": {
      const s = q.summary;
      panel = `<h3>${s.atkHuman ? "自分" : "CPU"}の攻撃：${esc(s.batter)}（${esc(s.attr)}） vs ${esc(s.pitcher)}</h3>
      <table style="width:auto"><tbody><tr><td>攻撃の札</td><td>${esc(s.aCards.join("・") || "なし")}</td><td class="n num"><b>AP ${s.AP}</b></td></tr>
      <tr><td>守備の札</td><td>${esc(s.dCards.join("・") || "なし")}</td><td class="n num"><b>DP ${s.DP}</b></td></tr></tbody></table>
      ${s.killedA.length || s.killedD.length ? `<p class="small">勝負師・威圧で消えた札：${esc(s.killedA.concat(s.killedD).join("・"))}</p>` : ""}
      <p style="font-size:16px">${s.judged ? `打撃判定 ${s.d1}+${s.d2}${s.dice ? (s.dice > 0 ? "+" : "") + s.dice : ""}＝${s.d1 + s.d2 + s.dice} → ` : "DP が上 → "}<b>${esc(s.res)}</b>${s.runs ? `（${s.runs}点）` : ""}</p>
      <button class="primary" data-act="next">次へ</button>`; break;
    }
    case "end":
      panel = `<h3>試合終了：${q.ctx.R.A.score} - ${q.ctx.R.B.score}（${esc(q.result)}）</h3><button class="primary" data-act="again">もう一度</button>`; break;
  }
  return boardHtml(q) + `<div class="panel" style="background:var(--panel-2)">${panel}</div>
    <h3>あなたの手札（${me.hand.length}枚）</h3><div class="small muted">${me.hand.map(x => esc(x.name)).join("・")}</div>
    <h3>記録</h3><div class="small" id="solog" style="max-height:260px;overflow:auto">${SO.log.slice(-60).map(esc).join("<br>")}</div>`;
}
function wireSolo() {
  const st = $("#soStart"); if (st) { const f = $("#soFirst"); st.onclick = () => { SO.aFirst = f.checked; soloStart(); }; wireCommon(); return; }
  const q = SO.req; if (!q) return;
  const lg = $("#solog"); if (lg) lg.scrollTop = lg.scrollHeight;
  const maxSel = { zoneReveal: q.take || 2, revealPick: q.take || 1, scry: q.cards ? q.cards.length : 0, mulligan: 99, kidou: q.kd && q.kd.type === "cycle" ? q.kd.n : 1, atkSelect: q.max || 2, defPre: 1, defPlace: q.max || q.forced || 2, honSwap: 1, honDiscard: 1, takeBack: 1, inningPick: 1, payHand: 1, discardPick: q.n || 1, pick: q.take || 1 }[q.type] || 0;
  document.querySelectorAll(".chip[data-i]").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, k = SO.sel.indexOf(i);
    if (k >= 0) SO.sel.splice(k, 1); else { if (SO.sel.length >= maxSel) SO.sel.shift(); SO.sel.push(i); }
    render();
  });
  document.querySelectorAll(".chip[data-in]").forEach(b => b.onclick = () => { SO.extra.inIdx = +b.dataset.in; render(); });
  document.querySelectorAll("input[name=isw]").forEach(r => r.onchange = () => { SO.extra.opt = +r.value; });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act, sel = SO.sel.slice();
    if (a === "step") { SO.extra.step = b.dataset.s || true; SO.sel = []; return render(); }
    if (a === "back") { SO.extra = {}; SO.sel = []; return render(); }
    switch (q.type) {
      case "mulligan": return soloStep({ idx: a === "ok" ? sel : [] });
      case "atkPre": return soloStep(a === "zone" ? { zone: true } : a === "pinch" ? { pinch: b.dataset.no } : {});
      case "kidou": return soloStep(a === "opt" ? { use: true, choice: +b.dataset.i2 } : a === "use" ? { use: true, placeIdx: sel[0], discardIdx: sel[0], idx: sel } : { use: false });
      case "zoneReveal": return soloStep({ idx: sel });
      case "revealPick": return soloStep({ idx: sel });
      case "scry": return soloStep({ keep: sel });
      case "takeBack": return soloStep({ idx: sel[0] != null ? sel[0] : 0 });
      case "atkSelect": return soloStep({ idx: sel, attr: b.dataset.a });
      case "defPre": return soloStep(a === "relief" ? { relief: true } : a === "swap" && sel.length ? { swapIdx: sel[0] } : {});
      case "defPlace": return soloStep({ idx: a === "ok" ? sel : [] });
      case "honSwap": return soloStep(a === "ok" && sel.length && SO.extra.inIdx != null ? { inIdx: SO.extra.inIdx, handIdx: sel[0] } : {});
      case "honDiscard": return soloStep(a === "none" || !sel.length ? {} : { idx: sel[0], mode: a });
      case "discardPick": return soloStep({ idx: sel });
      case "pick": return soloStep({ idx: a === "ok" ? sel : [] });
      case "choice": return soloStep({ i: +b.dataset.i2 });
      case "payHand": return soloStep(a === "ok" && sel.length ? { idx: sel[0] } : {});
      case "inningPick": return soloStep({ idx: sel[0] != null ? sel[0] : 0 });
      case "inningSwap": { const o = q.options[SO.extra.opt]; return soloStep(a === "ok" && o ? { ii: o.ii, ri: o.ri } : {}); }
      case "result": return soloStep(undefined);
      case "end": SO.req = null; return render();
    }
  });
}

function render() {
  renderTabs();
  const v = $("#view");
  if (!S.A || !S.B) { v.innerHTML = '<div class="empty">自分と仮想敵の両方にデッキを読み込んでください。</div>' + (S.tab === "rules" ? vRules() : ""); return; }
  const fn = { solo: vSolo, game: vGame, plan: vPlan, env: vEnv, swap: vSwap, scene: vScene, cover: vCover, rules: vRules }[S.tab] || vGame;
  v.innerHTML = head() + fn();
  if (S.tab === "game") wireGame();
  if (S.tab === "scene") wireScene();
  if (S.tab === "plan") wirePlan();
  if (S.tab === "env") wireEnv();
  if (S.tab === "swap") wireSwap();
  if (S.tab === "solo") wireSolo();
}
renderRecent(); render();
</script>
</body>
</html>
