<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ドリオ構築アナライザー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#ffffff; --panel-2:#f4f6f3; --ink:#17211c; --ink-soft:#55605a;
  --line:#d3dad3; --line-strong:#b7c1b8; --accent:#c81e2b; --navy:#0d3a6b; --gold:#c8891a;
  --ok:#1f7a4d; --warn:#b26a00; --ng:#c81e2b; --meet:#1d6fb8; --power:#c2410c;
  --hl:#fff4d6; --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.06); --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1418; --panel:#131e23; --panel-2:#0f171b; --ink:#e7ede9; --ink-soft:#93a29b;
  --line:#243138; --line-strong:#33454d; --accent:#e5424c; --navy:#3f7bd0; --gold:#e3a83c;
  --ok:#4fb381; --warn:#d69336; --ng:#e5424c; --meet:#5aa7ee; --power:#f08a4b; --hl:#2b2612;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0c1418; --panel:#131e23; --panel-2:#0f171b; --ink:#e7ede9; --ink-soft:#93a29b;
  --line:#243138; --line-strong:#33454d; --accent:#e5424c; --navy:#3f7bd0; --gold:#e3a83c;
  --ok:#4fb381; --warn:#d69336; --ng:#e5424c; --meet:#5aa7ee; --power:#f08a4b; --hl:#2b2612;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:14px;line-height:1.55}
.num,.mono{font-family:Oswald,"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
header{background:var(--navy);color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.loaders{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.loaders{grid-template-columns:1fr}}
.loader h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft)}
.tag.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.b{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:84px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--ink-soft)}
.small{font-size:12px}
.status{font-size:12px;color:var(--ink-soft);min-height:18px;margin-top:6px}
.status.err{color:var(--ng)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.recent button{font-size:12px;padding:3px 9px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabs button{border:none;border-radius:8px 8px 0 0;background:transparent;padding:8px 13px;color:var(--ink-soft);font-weight:700}
.tabs button.on{background:var(--panel);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-soft);font-weight:700;background:var(--panel-2);white-space:nowrap}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:700px}
.cname{white-space:nowrap}
.cname{cursor:pointer;border-bottom:1px dotted var(--line-strong)}
.cname:hover{color:var(--accent)}
.meet{color:var(--meet);font-weight:700}
.power{color:var(--power);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.ng{color:var(--ng);font-weight:700}
.warnc{color:var(--warn);font-weight:700}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-left:4px;border:1px solid var(--line-strong);color:var(--ink-soft);white-space:nowrap}
.badge.pin{border-color:var(--warn);color:var(--warn)}
.badge.awk{border-color:var(--gold);color:var(--gold)}
.hl{background:var(--hl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.stat .k{font-size:12px;color:var(--ink-soft)}
.stat .v{font-size:22px;font-weight:600}
.stat .v small{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:4px}
h3{font-size:15px;margin:16px 0 8px}
h3:first-child{margin-top:0}
.note{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.pct{display:inline-flex;align-items:center;min-width:92px}
.cond{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--panel-2)}
.cond .t{font-weight:700}
.cond .s{font-size:12px;color:var(--ink-soft);margin-top:3px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{padding:0 8px;line-height:22px;font-weight:700}
.chg-up{color:var(--ok);font-weight:700}
.chg-down{color:var(--ng);font-weight:700}
.diffcell{font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:560px){#modal .box{grid-template-columns:1fr}}
#modal img{width:100%;border-radius:8px;background:var(--panel-2)}
.effect{white-space:pre-wrap;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.searchres{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.searchres div{padding:5px 9px;border-bottom:1px solid var(--line);cursor:pointer}
.searchres div:hover{background:var(--panel-2)}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.toggle button{border:none;border-radius:0;padding:4px 10px}
.toggle button.on{background:var(--navy);color:#fff}
.foot{font-size:12px;color:var(--ink-soft);margin-top:20px}
</style>
</head>
<body>
<header>
  <h1>ドリオ構築アナライザー</h1>
  <div class="sub" id="dbinfo"></div>
</header>
<main>
  <p class="panel small" style="padding:9px 14px;margin-bottom:14px">知り合い内で使っているツールです。<b>URL を SNS などに載せたり、ほかの人に広めたりしないでください。</b></p>
  <div class="loaders">
    <section class="panel loader" data-slot="A">
      <h2><span class="tag a">A</span>分析するデッキ</h2>
      <div class="row"><input type="text" class="code" placeholder="DeckLogのデッキコード（例 1KQZVE）" style="flex:1;min-width:160px"><button class="primary load">読み込む</button></div>
      <details class="small" style="margin-top:6px"><summary>文字で入力する（対戦卓のデッキ文字と同じ形）</summary>
        <textarea class="text" placeholder="# オーダー&#10;TEAM-S03&#10;BP03-S04&#10;…（打順どおり1行1枚）&#10;# メイン&#10;3x BP01-S01&#10;…"></textarea>
        <button class="loadtext">この文字で分析</button></details>
      <div class="status"></div><div class="recent"></div>
    </section>
    <section class="panel loader" data-slot="B">
      <h2><span class="tag b">B</span>比べるデッキ（任意）</h2>
      <div class="row"><input type="text" class="code" placeholder="比べたいデッキコード（例 AXWSC）" style="flex:1;min-width:160px"><button class="load">読み込む</button><button class="ghost clear">外す</button></div>
      <details class="small" style="margin-top:6px"><summary>文字で入力する</summary>
        <textarea class="text"></textarea><button class="loadtext">この文字で読み込む</button></details>
      <div class="status"></div><div class="recent"></div>
    </section>
  </div>

  <section class="panel">
    <div class="row small">
      <span>打撃判定のダイス補正</span>
      <span class="toggle" id="oppdice"></span>
      <span class="muted">（相手投手のダイス−1や、自分の投手が登板中に打者全員へ付くダイス＋1などを、ここで足し引きして試せます）</span>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="view"><div class="empty">DeckLog のデッキコードを入れて「読み込む」を押してください。DeckLog で公開されているデッキならそのまま読み込めます。</div></section>
  <p class="foot" id="foot"></p>
</main>
<div id="modal"><div class="box" id="modalbox"></div></div>

<script>
/**
 * ドリオ構築アナライザー：分析の本体（ブラウザ・GAS・Node のどれでも動く。外部アクセスはしない）
 * 入力: デッキ（DeckLog の JSON か、対戦卓と同じ文字形式）と、カード番号 → カード情報 の辞書
 * 出力: ルールチェック・サマリー・打順表・攻守2役表・シナジー・TP収支・引ける確率・比較
 * 点数は付けない。ルールと数字で一意に決まる事実だけを並べ、評価はユーザーが行う。
 */

var POS_NAME = { 1: '投手', 2: '捕手', 3: '一塁手', 4: '二塁手', 5: '三塁手', 6: '遊撃手', 7: '外野手', 100: 'ZONE' };
var POS_SHORT = { 1: '投', 2: '捕', 3: '一', 4: '二', 5: '三', 6: '遊', 7: '外', 100: 'Z' };
var TEAM_CODE = { T: '阪神', DB: 'DeNA', G: '巨人', D: '中日', C: '広島', S: 'ヤクルト', H: 'ソフトバンク', F: '日本ハム', B: 'オリックス', E: '楽天', L: '西武', M: 'ロッテ' };
var TEAM_NICK = { タイガース: 'T', ベイスターズ: 'DB', ジャイアンツ: 'G', ドラゴンズ: 'D', カープ: 'C', スワローズ: 'S', ホークス: 'H', ファイターズ: 'F', バファローズ: 'B', イーグルス: 'E', ライオンズ: 'L', マリーンズ: 'M' };
var CIRCLED = { '⓪': 0, '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5, '⑥': 6, '⑦': 7, '⑧': 8, '⑨': 9, '⑩': 10 };
var TP_START = 3; // 公式プレイガイド「タイムポイント 3つ」
// 公式チームカードの打撃判定表（全球団共通。2d6＋補正の合計）
var JUDGE = {
  ミート: function (t) { return t <= 4 ? 'アウト' : t <= 10 ? '単打' : '二塁打'; },
  強振: function (t) { return t <= 6 ? 'アウト' : t === 7 ? '単打' : t <= 10 ? '二塁打' : '本塁打'; },
};

// 「4以上」の中で正確な値が分かっている戦術カード（公式カード画像で確認済み）
var DP_EXACT = { 'PDO-04': 5, 'PDO-05': 5, 'PDO-12': 4 };
function dpValue_(c) { if (c.no in DP_EXACT) return DP_EXACT[c.no]; return c.dpSup === '4+' ? 4 : Number(c.dpSup) || 0; }

function normName_(s) { return String(s || '').replace(/[\s　]/g, ''); }
function teamOf_(no) { var m = String(no).match(/^[A-Z]+\d*-(DB|[A-Z])\d+/); return m ? m[1] : ''; }
function isFielder_(c) { return c && c.kind === '選手' && c.pos >= 2 && c.pos <= 7; }

/** 基礎能力の文字（【先発⑧】【強振①】【代打⓪】など）を読む */
function parseBase_(base) {
  var out = { starter: null, relief: null, closer: null, pinch: null, dice: {} };
  var re = /【(先発|中継ぎ|抑え|代打|ミート|強振)([⓪①-⑩]|\+?\d+)】/g, m;
  var s = String(base || '');
  while ((m = re.exec(s))) {
    var n = m[2] in CIRCLED ? CIRCLED[m[2]] : Number(String(m[2]).replace('+', ''));
    if (m[1] === 'ミート' || m[1] === '強振') out.dice[m[1]] = n;
    else out[{ 先発: 'starter', 中継ぎ: 'relief', 抑え: 'closer', 代打: 'pinch' }[m[1]]] = n;
  }
  return out;
}

/** 効果テキストを能力ごとに分ける（【攻撃】【守備】【攻・守】＜攻撃＞などの区切り、／） */
function abilities_(eff) {
  return String(eff || '').split(/／|\n|(?=【(?:攻撃|守備|攻・守|攻\/守)】)|(?=＜(?:攻撃|守備|攻・守)＞)/).map(function (x) { return x.trim(); }).filter(Boolean);
}

/**
 * 効果テキストから「打撃判定を行うなら【ダイス】+N」を拾う。
 * supportOnly=false：打者本人の【攻撃】の能力（【サポート】以外）、true：手札から伏せる【サポート】の能力
 * 属性は直前の「ミート／強振で（打撃判定・勝負）を行うなら」から決める。書いてなければ両方。
 */
function diceFromEffect_(eff, supportOnly) {
  var out = [];
  abilities_(eff).forEach(function (ab) {
    if (!/【攻撃】|【攻・守】|【攻\/守】|＜攻撃＞|＜攻・守＞/.test(ab)) return;
    if (!!supportOnly !== MAIN_AREA_RE.test(ab)) return;
    var re = /【?ダイス】?\+(\d+)/g, m;
    while ((m = re.exec(ab))) {
      var before = ab.slice(0, m.index), am = before.match(/(ミート|強振)で(打撃判定|勝負)を行うなら[^。]*$/) || before.match(/(ミート|強振)で(打撃判定|勝負)[^。]*。?[^。]*$/);
      // 条件の文：能力の頭からダイス＋の文の終わりまで（長ければ後ろ側を残す）
      var endIdx = ab.indexOf('。', m.index); endIdx = endIdx < 0 ? ab.length : endIdx + 1;
      var cond = ab.slice(0, endIdx).replace(/^(【[^】]+】|＜[^＞]+＞)+/, '').trim();
      if (cond.length > 130) cond = '…' + cond.slice(-130);
      out.push({ n: +m[1], attr: am ? am[1] : '両方', cond: cond });
    }
  });
  return out;
}

// メインデッキのカードが手札から置かれて能力が働くエリア（サポート・イニング・レスト）
var MAIN_AREA_RE = /【(サポート|イニング|レスト)】/;

/** その能力を「持っている」か：能力の頭に付いた【 】のアイコンに含まれるか（文中で言及しているだけは含めない） */
function hasAbilityTag_(eff, tag) {
  return abilities_(eff).some(function (ab) { var head = (ab.match(/^(?:【[^】]+】|＜[^＞]+＞|\s)+/) || [''])[0]; return head.indexOf(tag) >= 0; });
}

/** K枚入りの札が、N枚の山から H 枚見たときに1枚以上ある確率 */
function probAtLeastOne_(N, K, H) {
  if (K <= 0 || H <= 0 || N <= 0) return 0;
  if (H > N - K) return 1;
  var p = 1;
  for (var i = 0; i < H; i++) p *= (N - K - i) / (N - i);
  return 1 - p;
}
/** ちょうど j 枚ある確率（超幾何分布） */
function probExactly_(N, K, H, j) {
  function lc(n, k) { if (k < 0 || k > n) return -Infinity; var s = 0; for (var i = 1; i <= k; i++) s += Math.log(n - k + i) - Math.log(i); return s; }
  var v = lc(K, j) + lc(N - K, H - j) - lc(N, H);
  return v === -Infinity ? 0 : Math.exp(v);
}

/** 打撃判定の確率（2d6＋補正）。結果ごとの確率を返す */
function judgeProb_(swing, mod) {
  var r = { アウト: 0, 単打: 0, 二塁打: 0, 本塁打: 0 };
  for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) r[JUDGE[swing](a + b + mod)] += 1 / 36;
  return r;
}

/** 対戦卓と同じ文字形式（# オーダー / # メイン、3x BP01-S01）を DeckLog 形式の JSON に直す */
function parseDeckText(txt, db) {
  var order = [], main = [], team = null, bucket = 'order', slot = 0, unknown = [];
  String(txt || '').split(/\r?\n/).forEach(function (line) {
    var s = line.trim();
    if (!s) return;
    if (/^#/.test(s)) { bucket = /メイン|main/i.test(s) ? 'main' : 'order'; return; }
    var n = 1, body = s, mm = s.match(/^(\d+)\s*[x×]\s*(.+)$/i) || s.match(/^(.+?)\s*[x×]\s*(\d+)$/i);
    if (mm) { if (/^\d+$/.test(mm[1])) { n = +mm[1]; body = mm[2]; } else { body = mm[1]; n = +mm[2]; } }
    var no = (body.match(/[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+/) || [])[0];
    if (!no) { unknown.push(s); return; }
    no = no.toUpperCase();
    if (/^TEAM-/.test(no)) { team = (db.__teams || {})[no] || { card_number: no, name: no, p_param: {} }; return; }
    var list = bucket === 'main' ? main : order;
    var ex = list.find(function (x) { return x.card_number === no; });
    if (bucket === 'order') { order.push({ card_number: no, num: 1, slot: ++slot }); }
    else if (ex) ex.num += n; else main.push({ card_number: no, num: n });
  });
  return { deck_id: '', title: '文字で入力したデッキ', p_list: order, list: main, sub_list: team ? [team] : [], _unknown: unknown };
}

/** デッキを DeckLog 形式の文字に書き出す（対戦卓にもそのまま貼れる） */
function deckToText(deck) {
  var s = '# オーダー' + (deck.deck_id ? '（DeckLog ' + deck.deck_id + '）' : '') + '\n';
  var team = (deck.sub_list || [])[0];
  if (team) s += team.card_number + '\n';
  (deck.p_list || []).slice().sort(function (a, b) { return (a.slot || 0) - (b.slot || 0); })
    .forEach(function (c) { s += c.card_number + '\n'; });
  s += '# メイン\n';
  (deck.list || []).forEach(function (c) { if (c.num > 0) s += (c.num > 1 ? c.num + 'x ' : '') + c.card_number + '\n'; });
  return s;
}

/** DeckLog は同じカード番号でも絵柄違い（パラレル）を別の行にするので、番号ごとに合算する */
function normalizeDeck(deck) {
  var merged = [], idx = {};
  (deck.list || []).forEach(function (c) {
    var no = c.card_number;
    if (no in idx) merged[idx[no]].num += (c.num || 1);
    else { idx[no] = merged.length; merged.push({ card_number: no, num: c.num || 1 }); }
  });
  deck.list = merged;
  return deck;
}

function analyzeDeck(deck, db, opt) {
  opt = opt || {};
  deck = normalizeDeck(JSON.parse(JSON.stringify(deck)));
  var get = function (no) { return db[no] || { no: no, name: no + '（カード情報なし）', missing: true }; };
  var withNum = function (c) { var o = {}, src = get(c.card_number), k; for (k in src) o[k] = src[k]; o.no = c.card_number; o.num = c.num || 1; o.slot = c.slot || 0; return o; };
  var order = (deck.p_list || []).slice().sort(function (a, b) { return (a.slot || 0) - (b.slot || 0); }).map(withNum);
  var main = (deck.list || []).filter(function (c) { return (c.num || 0) > 0; }).map(withNum);
  var teamRaw = (deck.sub_list || [])[0] || {};

  var tacticCount = function (name) { return main.filter(function (c) { return c.kind === '戦術' && normName_(c.name) === name; }).reduce(function (s2, c) { return s2 + c.num; }, 0); };

/** 2つのデッキの違い（メインの枚数差・サマリー差・打順差） */
function compareDecks(a, b) {

  a.twoWay.concat(a.tactics).forEach(function (r) { rowsA[r.no] = r; });
  b.twoWay.concat(b.tactics).forEach(function (r) { rowsB[r.no] = r; });

const DB_INFO = {"cards": 1813, "date": "2026-10-13"};
const PROXY = "https://dorio-decklog-proxy.gari-gari-noise.workers.dev";
const IMG_BASE = "https://dreamorder.com/wordpress/wp-content/images/cardlist/";
const DEFAULT_TEAM = { card_number: "", name: "（チームカード不明：標準の上限 18/6/13・メイン40・オーダー15 で判定）", p_param: { p6: "18/6/13" }, max_main_num: 40, max_order_num: 15 };
const LS = (() => { try { const k = "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
const lsGet = (k, d) => { try { const v = LS && LS.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { LS && LS.setItem(k, JSON.stringify(v)); } catch (e) {} };

const S = { A: null, B: null, origA: null, tab: lsGet("dorio_an_tab", "summary"), oppDice: 0 };
const $ = (s, el = document) => el.querySelector(s);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = p => p == null ? "—" : Math.round(p * 100) + "%";
const pctBar = p => p == null ? "—" : `<span class="pct"><span class="bar" style="width:${Math.round(p * 50)}px"></span><span class="num">${Math.round(p * 100)}%</span></span>`;
const attrCls = a => a === "ミート" ? "meet" : a === "強振" ? "power" : "";
const supHtml = s => { if (!s) return '<span class="muted">—</span>'; const a = s.split(" ")[0]; return `<span class="${attrCls(a)}">${esc(s)}</span>`; };
const cname = (no, name) => `<span class="cname" data-no="${esc(no)}">${esc(name)}</span>`;

function deckClone(d) { return JSON.parse(JSON.stringify(d)); }
function withTeam(d) { if (!(d.sub_list || []).length) d.sub_list = [Object.assign({}, DEFAULT_TEAM)]; return d; }

async function fetchDeck(code) {
  code = (code || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{3,12}$/.test(code)) throw new Error("デッキコードの形式が違います（例 1KQZVE）");
  const r = await fetch(PROXY + "/" + encodeURIComponent(code));
  if (!r.ok) throw new Error("取得に失敗しました（" + r.status + "）");
  const j = await r.json();
  if (!j || !j.list) throw new Error("このコードのデッキが見つかりません");
  return j;
}

function rememberRecent(d) {
  if (!d.deck_id) return;
  const list = lsGet("dorio_an_recent", []).filter(x => x.code !== d.deck_id);
  list.unshift({ code: d.deck_id, title: d.title || "" });
  lsSet("dorio_an_recent", list.slice(0, 10));
  renderRecent();
}
function renderRecent() {
  const list = lsGet("dorio_an_recent", []);
  document.querySelectorAll(".loader").forEach(sec => {
    const box = $(".recent", sec);
    box.innerHTML = list.length ? '<span class="small muted">最近：</span>' + list.map(x => `<button data-code="${esc(x.code)}" title="${esc(x.title)}">${esc(x.code)}${x.title ? " " + esc(x.title.slice(0, 10)) : ""}</button>`).join("") : "";
    box.querySelectorAll("button").forEach(b => b.onclick = () => { $(".code", sec).value = b.dataset.code; $(".load", sec).click(); });
  });
}

function setDeck(slot, d) {
  normalizeDeck(d); withTeam(d);
  S[slot] = d;
  if (slot === "A") S.origA = deckClone(d);
  if (slot === "B" && S.tab === "summary") S.tab = "compare";
  render();
}

document.querySelectorAll(".loader").forEach(sec => {
  const slot = sec.dataset.slot, st = $(".status", sec);
  $(".load", sec).onclick = async () => {
    st.className = "status"; st.textContent = "読み込み中…";
    try { const d = await fetchDeck($(".code", sec).value); st.textContent = `読み込みました：${d.deck_id}「${d.title || ""}」`; rememberRecent(d); setDeck(slot, d); }
    catch (e) { st.className = "status err"; st.textContent = e.message + "（ネット接続とコードを確認してください。つながらないときは下の「文字で入力」が使えます）"; }
  };
  $(".code", sec).addEventListener("keydown", e => { if (e.key === "Enter") $(".load", sec).click(); });
  $(".loadtext", sec).onclick = () => {
    const d = parseDeckText($(".text", sec).value, DB);
    st.className = d._unknown.length ? "status err" : "status";
    st.textContent = `文字から読み込みました：オーダー ${d.p_list.length} 枚・メイン ${d.list.reduce((s, c) => s + c.num, 0)} 枚` + (d._unknown.length ? `（読めなかった行：${d._unknown.slice(0, 3).join(" / ")}）` : "");
    setDeck(slot, d);
  };
  const clr = $(".clear", sec);
  if (clr) clr.onclick = () => { S.B = null; $(".code", sec).value = ""; st.textContent = ""; if (S.tab === "compare") S.tab = "summary"; render(); };
});

const DICE_OPTS = [-2, -1, 0, 1, 2];
function renderOpp() {
  $("#oppdice").innerHTML = DICE_OPTS.map(v => `<button class="${v === S.oppDice ? "on" : ""}" data-v="${v}">${v > 0 ? "+" + v : v}</button>`).join("");
  $("#oppdice").querySelectorAll("button").forEach(b => b.onclick = () => { S.oppDice = +b.dataset.v; renderOpp(); render(); });
}

const TABS = [
  ["summary", "サマリー"], ["batting", "打順・投手"], ["twoway", "攻守2役"], ["synergy", "シナジー"],
  ["tp", "TP・手札"], ["prob", "引ける確率"], ["edit", "入れ替えを試す"], ["compare", "比較"], ["export", "書き出し"],
];
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = b.dataset.k; lsSet("dorio_an_tab", S.tab); render(); });
}

function analyze(d) { return d ? analyzeDeck(d, DB, { oppDice: S.oppDice }) : null; }

function render() {
  renderTabs();
  const v = $("#view");
  if (!S.A) { v.innerHTML = '<div class="empty">DeckLog のデッキコードを入れて「読み込む」を押してください。DeckLog で公開されているデッキならそのまま読み込めます。</div>'; return; }
  const a = analyze(S.A), b = analyze(S.B);
  const head = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><span class="tag a">A</span> <b>${esc(a.title || "（無題）")}</b> <span class="muted small">${esc(a.code)}　${esc(a.team.name)}</span>${isEdited() ? ' <span class="badge pin">入れ替え中</span>' : ""}</div>${b ? `<div><span class="tag b">B</span> <b>${esc(b.title || "（無題）")}</b> <span class="muted small">${esc(b.code)}</span></div>` : ""}</div>`;
  const fn = { summary: vSummary, batting: vBatting, twoway: vTwoWay, synergy: vSynergy, tp: vTp, prob: vProb, edit: vEdit, compare: vCompare, export: vExport }[S.tab] || vSummary;
  v.innerHTML = head + fn(a, b);
  v.querySelectorAll(".cname").forEach(el => el.onclick = () => openCard(el.dataset.no));
  if (S.tab === "edit") wireEdit();
  if (S.tab === "export") wireExport(a);
}

function checksHtml(a) {

}
function statGrid(a) {

function vSummary(a) {

function judgeCells(r) {
  const j = r.judge, je = r.judgeEff || {}, add = r.effAdd || {};
  if (!j) return '<td colspan="2" class="muted">—</td>';
  const m = j["ミート"], p = j["強振"];
  const em = je["ミート"], ep = je["強振"];
  return `<td class="small"><span class="meet">アウト以外 ${pct(1 - m["アウト"])}</span><br><span class="muted">長打 ${pct(m["二塁打"])}</span>${em ? `<div class="hl" style="margin-top:3px;padding:1px 4px;border-radius:4px">効果+${add["ミート"]}のとき <b class="meet">${pct(1 - em["アウト"])}</b><br><span class="muted">長打 ${pct(em["二塁打"])}</span></div>` : ""}</td>
          <td class="small"><span class="power">アウト以外 ${pct(1 - p["アウト"])}</span><br><span class="muted">長打 ${pct(p["二塁打"] + p["本塁打"])}（うち本塁打 ${pct(p["本塁打"])}）</span>${ep ? `<div class="hl" style="margin-top:3px;padding:1px 4px;border-radius:4px">効果+${add["強振"]}のとき <b class="power">${pct(1 - ep["アウト"])}</b><br><span class="muted">長打 ${pct(ep["二塁打"] + ep["本塁打"])}（うち本塁打 ${pct(ep["本塁打"])}）</span></div>` : ""}</td>`;
}
const effCell = r => {
  const d = (r.effDice || []).map(x => `<div class="small"><span class="${attrCls(x.attr)}">${x.attr === "両方" ? "ミート・強振" : x.attr} ダイス+${x.n}</span> <span class="muted">${esc(x.cond)}</span></div>`).join("");
  return `<td style="min-width:220px">${d}${r.eff ? `<details class="small"><summary class="muted">効果の全文</summary><div class="effect">${esc(r.eff)}</div></details>` : '<span class="muted small">効果なし</span>'}</td>`;

function vBatting(a) {

  ${bat.map(r => `<tr><td class="num">${r.bat || (r.role === "代打" ? "代打" : "控え")}</td><td>${r.posShort}</td><td>${cname(r.no, r.name)}<div class="small muted">${esc(r.no)}${r.role === "代打" && r.b.pinch != null ? `・代打${r.b.pinch}ドロー` : ""}</div></td><td class="n num">${r.cost ?? "—"}</td><td class="n num">${r.ap ?? "—"}</td><td>${dice(r.b)}</td>
   <td>${r.awakenCopies ? `<b class="num">${r.awakenCopies}</b>枚 <span class="badge awk">${esc(r.awakenAdd)}</span><div class="small muted">初手に1枚以上 ${pct(r.pHand)}</div>` : '<span class="muted">0枚</span>'}</td>${judgeCells(r)}${effCell(r)}</tr>`).join("")}
  </tbody></table></div>
  <p class="note">「アウト以外」＝打撃判定でアウトにならない確率（ミートなら単打か二塁打、強振なら単打・二塁打・本塁打のどれか）。「長打」＝二塁打以上（ミートの判定表で出る長打は二塁打だけ、強振は二塁打と本塁打。三塁打は判定表からは出ない）。打撃判定は公式チームカードの表（2d6＋補正。ミート：4以下アウト・5〜10単打・11以上二塁打／強振：6以下アウト・7単打・8〜10二塁打・11以上本塁打）。上の段は基礎能力の【ミート①】【強振②】と、上で選んだ補正（今は ${S.oppDice > 0 ? "+" : ""}${S.oppDice}）だけ。黄色の段は、その打者自身の効果のダイス＋の<b>条件をすべて満たしたとき</b>（ビハインド時・覚醒・代打で出たとき・コンボなど。条件は効果の列に書いてある）。</p>

  ${a.diceCards.length ? `<h3>メインから伏せてダイス＋を足せる札</h3>${a.diceCards.map(d => `<div class="small">${cname(d.no, d.name)} ×${d.num}：<span class="${attrCls(d.attr)}">${d.attr === "両方" ? "ミート・強振" : d.attr} ダイス+${d.n}</span> <span class="muted">${esc(d.cond)}</span></div>`).join("")}` : ""}
  <h3>投手</h3><div class="scroll"><table><thead><tr><th>役割</th><th>投手</th><th class="n">コスト</th><th class="n">DP</th><th>基礎能力</th><th>覚醒札（メイン）</th></tr></thead><tbody>
  ${pit.map(r => `<tr><td>${esc(r.role || "")}</td><td>${cname(r.no, r.name)}<div class="small muted">${esc(r.no)}</div></td><td class="n num">${r.cost ?? "—"}</td><td class="n num">${r.dp ?? "—"}</td><td class="small">${esc(r.base || "")}</td>
   <td>${r.awakenCopies ? `<b class="num">${r.awakenCopies}</b>枚 <span class="badge awk">${esc(r.awakenAdd)}</span><div class="small muted">初手に1枚以上 ${pct(r.pHand)}</div>` : '<span class="muted">0枚</span>'}</td></tr>`).join("")}
  </tbody></table></div>

}

function vTwoWay(a) {
  const sd = a.starter ? a.starter.dp : null;
  const oneCell = r => r.defOne == null ? '<span class="muted">—</span>' : `<span class="num ${r.defOne >= 11 ? "ok" : ""}">${r.defOne}${r.defOneAtLeast ? "+" : ""}</span>`;
  return `<h3>メインの選手カード（攻撃と守備の2役）</h3><div class="scroll"><table><thead><tr><th>カード</th><th class="n">枚数</th><th>攻撃で足すもの</th><th>守備で足すもの</th><th class="n">先発DP＋この1枚</th></tr></thead><tbody>
  ${a.twoWay.map(r => `<tr class="${r.defAwaken ? "hl" : ""}"><td>${cname(r.no, r.name)}${r.single ? '<span class="badge pin">1枚</span>' : ""}<div class="small muted">${esc(r.no)}</div></td><td class="n num">${r.num}</td>
   <td>${r.atkAwaken ? `<span class="badge awk">覚醒</span> ${esc(r.atkAwaken)}<div class="small muted">ほかの打席は ${supHtml(r.atkSup)}</div>` : supHtml(r.atkSup)}</td>
   <td>${r.defAwaken ? `<span class="badge awk">覚醒</span> ${esc(r.defAwaken)}<div class="small muted">ほかの投手のときは ${supHtml(r.defSup)}</div>` : supHtml(r.defSup)}</td><td class="n">${oneCell(r)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">覚醒：メインエリアの選手と同じカード番号を伏せると、サポート値の代わりにその選手の元々のAP（打者）／DP（投手）が足される（属性は関係ない）。「先発DP＋この1枚」は先発${a.starter ? "（" + esc(a.starter.name) + " DP" + sd + "）" : ""}が登板中に、このカードだけを伏せたときの値。サポートは相手の宣言と属性が合ったときだけ足される。カード効果による加算は入っていません。11以上を緑にしています。「4以上」と出るサポート値は、公式の検索で4と5以上を区別できないため（＋を付けています）。</p>

  ${a.tactics.map(r => `<tr><td>${cname(r.no, r.name)}${r.single ? '<span class="badge pin">1枚</span>' : ""}</td><td class="n num">${r.num}</td><td>${supHtml(r.atkSup)}</td><td>${supHtml(r.defSup)}</td><td class="small">${esc(r.eff)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

  <h3>TPを増やす手段</h3>${a.tp.gain.length ? `<table><tbody>${a.tp.gain.map(g => `<tr><td style="width:30%">${esc(g.name)}</td><td class="small">${esc(g.what)}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">効果テキストに「タイムポイントを獲得」は見つかりませんでした。</p>'}

// ---- 入れ替えを試す（メインの枚数・オーダーの交換と打順・案の保存）----
const orderSig = d => JSON.stringify((d.p_list || []).slice().sort((x, y) => (x.slot || 0) - (y.slot || 0)).map(c => c.card_number));
const mainSig = d => JSON.stringify((d.list || []).filter(c => c.num > 0).map(c => [c.card_number, c.num]).sort());
function isEdited() { return S.origA && (mainSig(S.A) !== mainSig(S.origA) || orderSig(S.A) !== orderSig(S.origA)); }
function sortedOrder() { return (S.A.p_list || []).slice().sort((x, y) => (x.slot || 0) - (y.slot || 0)); }
function renumber(list) { list.forEach((c, i) => c.slot = i + 1); S.A.p_list = list; }
const statLine = d => `${d.kind === "戦術" ? "戦術" : d.kind === "ZONE選手" ? "ZONE" : (POS_SHORT[d.pos] || "") + " c" + (d.cost ?? "?") + " " + (d.pos === 1 ? "DP" + d.dp : "AP" + d.ap)}　${d.apAttr ? d.apAttr + "AP" + d.apSup : ""} ${d.dpAttr ? d.dpAttr + "DP" + d.dpSup : ""}`;
function vEdit(a) {
  const orig = {}; (S.origA.list || []).forEach(c => orig[c.card_number] = c.num);
  const total = (S.A.list || []).reduce((s, c) => s + c.num, 0);
  const origOrder = new Set((S.origA.p_list || []).map(c => c.card_number));
  const ord = sortedOrder().map((c, i, arr) => {
    const d = DB[c.card_number] || {};
    return `<tr class="${origOrder.has(c.card_number) ? "" : "hl"}"><td class="num">${i + 1}</td><td>${cname(c.card_number, d.name || c.card_number)}<div class="small muted">${esc(c.card_number)}　${esc(statLine(d))}</div></td>
     <td style="white-space:nowrap"><button class="mv" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>↑</button> <button class="mv" data-i="${i}" data-d="1" ${i === arr.length - 1 ? "disabled" : ""}>↓</button> <button class="rep" data-i="${i}">交換</button> <button class="del" data-i="${i}">外す</button></td></tr>`;
  }).join("");
  const rows = (S.A.list || []).map(c => {
    const d = DB[c.card_number] || {}, o = orig[c.card_number] || 0, diff = c.num - o;
    return `<tr><td>${cname(c.card_number, d.name || c.card_number)}<div class="small muted">${esc(c.card_number)}　${esc(statLine(d))}</div></td>
     <td><span class="stepper"><button data-no="${esc(c.card_number)}" data-d="-1">−</button><b class="num" style="min-width:18px;text-align:center">${c.num}</b><button data-no="${esc(c.card_number)}" data-d="1">＋</button></span></td>
     <td class="${diff > 0 ? "chg-up" : diff < 0 ? "chg-down" : "muted"}">${diff ? (diff > 0 ? "+" : "") + diff : ""}</td></tr>`;
  }).join("");
  const changes = Object.keys(Object.assign({}, orig, Object.fromEntries((S.A.list || []).map(c => [c.card_number, c.num])))).map(no => {
    const now = ((S.A.list || []).find(c => c.card_number === no) || {}).num || 0, was = orig[no] || 0;
    return now === was ? null : `${(DB[no] || {}).name || no} ${was}→${now}`;
  }).filter(Boolean);
  const nowOrder = new Set((S.A.p_list || []).map(c => c.card_number));
  const ordIn = [...nowOrder].filter(n => !origOrder.has(n)).map(n => (DB[n] || {}).name || n);
  const ordOut = [...origOrder].filter(n => !nowOrder.has(n)).map(n => (DB[n] || {}).name || n);
  const reordered = orderSig(S.A) !== orderSig(S.origA) && !ordIn.length && !ordOut.length;
  const saved = lsGet("dorio_an_variants", []);
  const mode = S.addMode || "main";
  const chg = [...changes.map(esc), ordIn.length ? "オーダーに入れた：" + esc(ordIn.join("・")) : "", ordOut.length ? "オーダーから外した：" + esc(ordOut.join("・")) : "", reordered ? "打順の並び" : ""].filter(Boolean);
  return `<p class="note" style="margin-top:0">変えるとほかのタブもすぐ作り直されます。元のデッキは消えません。案は名前を付けて保存できます（このブラウザの中だけに保存）。</p>
  <div class="row"><button id="undoEdit">元に戻す</button><button id="toB">元のデッキをBに置いて比べる</button>
   <input type="text" id="vname" placeholder="案の名前（例 案E ミートDP5）" style="width:200px"><button id="saveVar" class="primary">この案を保存</button></div>
  ${saved.length ? `<div class="recent" style="margin-top:8px"><span class="small muted">保存した案：</span>${saved.map((v, i) => `<span class="badge" style="padding:2px 6px"><a href="#" class="loadVar" data-i="${i}">${esc(v.name)}</a> <a href="#" class="delVar" data-i="${i}" title="削除">×</a></span>`).join(" ")}</div>` : ""}
  ${chg.length ? `<p class="small">変更：${chg.join("　")}</p>` : ""}
  <h3>カードを探して足す</h3>
  <div class="row"><span class="toggle" id="addmode"><button data-m="main" class="${mode === "main" ? "on" : ""}">メインに足す</button><button data-m="order" class="${mode === "order" ? "on" : ""}">${S.replaceAt != null ? "オーダーの " + (S.replaceAt + 1) + " 番目と交換" : "オーダーに足す"}</button></span>
   <input type="text" id="addq" placeholder="名前か番号（例 内野警戒、山田、BP03-S07）" style="flex:1;min-width:180px"></div><div id="addres"></div>
  <h3>オーダー（打順は上から）</h3>
  <div class="scroll"><table><thead><tr><th>#</th><th>カード</th><th>操作</th></tr></thead><tbody>${ord}</tbody></table></div>
  <h3>メイン ${total} 枚${total !== (a.team.mainMax || 40) ? ` <span class="ng">（${a.team.mainMax || 40}枚にしてください）</span>` : ""}</h3>
  <div class="scroll"><table><thead><tr><th>カード</th><th>枚数</th><th>元から</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function wireEdit() {
  document.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
    const no = b.dataset.no, d = +b.dataset.d, c = S.A.list.find(x => x.card_number === no);
    c.num = Math.max(0, Math.min((DB[no] || {}).max || 3, c.num + d)); render();
  });
  document.querySelectorAll("button.mv").forEach(b => b.onclick = () => {
    const l = sortedOrder(), i = +b.dataset.i, j = i + (+b.dataset.d);
    [l[i], l[j]] = [l[j], l[i]]; renumber(l); render();
  });
  document.querySelectorAll("button.del").forEach(b => b.onclick = () => { const l = sortedOrder(); l.splice(+b.dataset.i, 1); renumber(l); render(); });
  document.querySelectorAll("button.rep").forEach(b => b.onclick = () => { S.replaceAt = +b.dataset.i; S.addMode = "order"; render(); $("#addq").focus(); });
  document.querySelectorAll("#addmode button").forEach(b => b.onclick = () => { S.addMode = b.dataset.m; if (S.addMode === "main") S.replaceAt = null; render(); });
  $("#undoEdit").onclick = () => { S.A = deckClone(S.origA); S.replaceAt = null; render(); };
  $("#toB").onclick = () => { S.B = deckClone(S.origA); S.B.title = (S.B.title || "") + "（元）"; S.tab = "compare"; render(); };
  $("#saveVar").onclick = () => {
    const name = $("#vname").value.trim() || ((S.A.title || "案") + " " + new Date().toLocaleString("ja-JP").slice(0, 16));
    const list = lsGet("dorio_an_variants", []).filter(v => v.name !== name);
    list.unshift({ name, deck: S.A, orig: S.origA, date: new Date().toISOString().slice(0, 10) });
    lsSet("dorio_an_variants", list.slice(0, 40)); render();
  };
  document.querySelectorAll(".loadVar").forEach(el => el.onclick = e => { e.preventDefault(); const v = lsGet("dorio_an_variants", [])[+el.dataset.i]; if (!v) return; S.A = deckClone(v.deck); S.origA = deckClone(v.orig || v.deck); render(); });
  document.querySelectorAll(".delVar").forEach(el => el.onclick = e => { e.preventDefault(); const l = lsGet("dorio_an_variants", []); const v = l[+el.dataset.i]; if (v && confirm("「" + v.name + "」を消す？")) { l.splice(+el.dataset.i, 1); lsSet("dorio_an_variants", l); render(); } });
  const q = $("#addq"), res = $("#addres");
  q.oninput = () => {
    const t = q.value.trim().replace(/[\s　]/g, "").toUpperCase(), toOrder = S.addMode === "order";
    if (!t) { res.innerHTML = ""; return; }
    const hit = Object.values(DB).filter(c => c && c.no && (toOrder ? c.kind !== "戦術" : c.kind !== "ZONE選手") && (c.no.includes(t) || c.name.replace(/[\s　]/g, "").toUpperCase().includes(t))).slice(0, 40);
    res.innerHTML = `<div class="searchres">${hit.map(c => `<div data-no="${esc(c.no)}">${esc(c.name)} <span class="small muted">${esc(c.no)}　${esc(statLine(c))}</span></div>`).join("") || '<div class="muted">見つかりません</div>'}</div>`;
    res.querySelectorAll("[data-no]").forEach(el => el.onclick = () => {
      const no = el.dataset.no;
      if (toOrder) {
        const l = sortedOrder();
        if (S.replaceAt != null && l[S.replaceAt]) l[S.replaceAt] = { card_number: no, num: 1 }; else l.push({ card_number: no, num: 1 });
        renumber(l); S.replaceAt = null;
      } else {
        const ex = S.A.list.find(x => x.card_number === no);
        if (ex) ex.num = Math.min((DB[no] || {}).max || 3, ex.num + 1); else S.A.list.push({ card_number: no, num: 1 });
      }
      q.value = ""; render();
    });
  };
}

function vCompare(a, b) {
  if (!b) return '<div class="empty">「B 比べるデッキ」にコードを入れると、ここに違いが出ます。入れ替えタブの「元のデッキをBに置いて比べる」でも使えます。</div>';
  const c = compareDecks(a, b);
  const L = { players: "選手", tactics: "戦術", fielders: "メインの野手", pitchers: "メインの投手", apMeet: "APミート", apPower: "AP強振", dpMeet: "DPミート（全部）", dpPower: "DP強振（全部）", dpMeet4: "DPミート4以上", dpPower4: "DP強振4以上" };
  return `<h3>デッキの形の違い</h3><table><thead><tr><th></th><th class="n"><span class="tag a">A</span></th><th class="n"><span class="tag b">B</span></th><th class="n">差</th></tr></thead><tbody>
  ${c.summary.map(r => `<tr><td>${L[r.key]}</td><td class="n num">${r.a}</td><td class="n num">${r.b}</td><td class="n num diffcell ${r.a > r.b ? "chg-up" : r.a < r.b ? "chg-down" : "muted"}">${r.a - r.b ? (r.a - r.b > 0 ? "+" : "") + (r.a - r.b) : "0"}</td></tr>`).join("")}</tbody></table>
  <h3>メインの枚数が違うカード</h3>${c.main.length ? `<table><thead><tr><th>カード</th><th class="n"><span class="tag a">A</span></th><th class="n"><span class="tag b">B</span></th></tr></thead><tbody>${c.main.map(r => `<tr><td>${cname(r.no, r.name)} <span class="small muted">${esc(r.no)}${r.kind === "戦術" ? "・戦術" : ""}</span></td><td class="n num ${r.a > r.b ? "chg-up" : ""}">${r.a}</td><td class="n num ${r.b > r.a ? "chg-up" : ""}">${r.b}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">メインは同じです。</p>'}
  <h3>打順</h3><table><thead><tr><th>打順</th><th><span class="tag a">A</span></th><th><span class="tag b">B</span></th></tr></thead><tbody>${c.batting.map(r => `<tr class="${r.same ? "" : "hl"}"><td class="num">${r.n}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`).join("")}</tbody></table>`;
}

function mdExport(a) {
  const L = [];
  L.push(`## ${a.title || "デッキ"}${a.code ? `（[${a.code}](https://decklog.bushiroad.com/view/${a.code})）` : ""}`, "");
  L.push(`- チーム：${a.team.name}／先発：${a.starter ? a.starter.name + "（DP" + a.starter.dp + "・初手" + a.hand + "枚）" : "不明"}`);
  const s = a.summary;
  L.push(`- 選手 ${s.players}／戦術 ${s.tactics}（メインの野手 ${s.fielders}・投手 ${s.pitchers}）`);
  L.push(`- APサポート：ミート ${s.apMeet}／強振 ${s.apPower}　DPサポート：ミート ${s.dpMeet}／強振 ${s.dpPower}`);
  const ng = a.checks.filter(c => !c.ok); if (ng.length) L.push(`- ルールチェック：${ng.map(c => c.label + "（" + c.detail + "）").join("、")}`);
  L.push("", "| 打順 | 選手 | AP | 覚醒札 | ミートでアウト以外 | 強振でアウト以外 |", "|--:|---|--:|--:|--:|--:|");
  a.order.filter(r => r.bat).forEach(r => L.push(`| ${r.bat} | ${r.name} ${r.no} | ${r.ap ?? ""} | ${r.awakenCopies} | ${pct(1 - r.judge["ミート"]["アウト"])} | ${pct(1 - r.judge["強振"]["アウト"])} |`));
  L.push("", "| メインの選手 | 枚数 | 攻撃 | 守備 |", "|---|--:|---|---|");
  a.twoWay.forEach(r => L.push(`| ${r.name} ${r.no} | ${r.num} | ${r.atkAwaken ? "覚醒 " + r.atkAwaken + "／他 " + (r.atkSup || "—") : r.atkSup || "—"} | ${r.defAwaken ? "覚醒 " + r.defAwaken + "／他 " + (r.defSup || "—") : r.defSup || "—"} |`));
  L.push("", "| 戦術 | 枚数 | 攻撃 | 守備 |", "|---|--:|---|---|");
  a.tactics.forEach(r => L.push(`| ${r.name} | ${r.num} | ${r.atkSup || "—"} | ${r.defSup || "—"} |`));
  if (a.tp.use.length) L.push("", `- TPの使い道：${a.tp.use.map(u => u.name + "＝" + u.what).join("、")}`);
  L.push("", `（ドリオ構築アナライザーで出力 ${new Date().toISOString().slice(0, 10)}）`);
  return L.join("\n");
}
function vExport(a) {
  return `<h3>Obsidian のノートに貼る（Markdown）</h3><textarea id="mdout" style="min-height:260px">${esc(mdExport(a))}</textarea><div class="row"><button id="copymd" class="primary">コピー</button></div>
  <h3>デッキの文字（対戦卓にそのまま貼れる）</h3><textarea id="txtout" style="min-height:180px">${esc(deckToText(S.A))}</textarea><div class="row"><button id="copytxt">コピー</button></div>`;
}
function wireExport() {
  const cp = (id, btn) => { const t = $(id); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); } btn.textContent = "コピーしました"; setTimeout(() => btn.textContent = "コピー", 1500); };
  $("#copymd").onclick = e => cp("#mdout", e.target);
  $("#copytxt").onclick = e => cp("#txtout", e.target);
}

function openCard(no) {
  const c = DB[no]; if (!c) return;
  const stat = c.kind === "戦術" ? "戦術カード" : c.kind === "ZONE選手" ? "ZONE選手" : `${POS_NAME[c.pos] || ""}・コスト${c.cost ?? "?"}・${c.pos === 1 ? "DP" + c.dp : "AP" + c.ap}`;
  $("#modalbox").innerHTML = `<div>${c.img ? `<img src="${IMG_BASE + esc(c.img)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none'">` : ""}</div>
   <div><div class="small muted">${esc(c.no)}</div><h3 style="margin:2px 0 6px">${esc(c.name)}</h3><div class="small">${esc(stat)}</div>
   <div class="small" style="margin:4px 0">${supHtml(c.apAttr ? c.apAttr + " AP" + c.apSup : "")}${c.apGuess ? '<span class="small muted">（DeckLog に値が無いため推定）</span>' : ""}　${supHtml(c.dpAttr ? c.dpAttr + " DP" + c.dpSup : "")}</div>
   ${c.base ? `<div class="small">基礎能力：${esc(c.base)}</div>` : ""}<div class="effect" style="margin-top:8px">${esc(c.eff || "（効果なし）")}</div>
   ${c.effSrc === "table" ? '<p class="small warnc">公式カードリストに効果の記載が無いため、別に記録した文を表示しています（要確認）。</p>' : ""}
   ${c.oid ? `<p class="small"><a href="https://dreamorder.com/cardlist/?id=${c.oid}" target="_blank" rel="noopener">公式カードリストで見る</a></p>` : ""}
   <button onclick="document.getElementById('modal').classList.remove('on')">閉じる</button></div>`;
  $("#modal").classList.add("on");
}
$("#modal").onclick = e => { if (e.target.id === "modal") e.target.classList.remove("on"); };

$("#dbinfo").textContent = `カード ${DB_INFO.cards || "?"} 枚（${DB_INFO.date || ""} 時点の DeckLog・公式カードリストから作成）`;
$("#foot").innerHTML = `データ：AP・DP・コスト・サポート値は DeckLog の検索、効果と基礎能力は公式カードリスト、打撃判定表は公式チームカード、ルールは公式プレイガイドと用語集。新弾が出たら辞書の作り直しが必要です。<br>このページは<b>非公式のファンツール</b>です。カード名・効果テキスト・カード画像などの権利は株式会社ブシロード・日本野球機構（NPB）および各権利者に帰属します。カード画像は公式サイトのものを表示しています。問題がある場合はすぐに公開をやめます。`;
renderOpp(); renderRecent(); render();
const q0 = new URLSearchParams(location.search).get("code");
if (q0) { const sec = document.querySelector('.loader[data-slot="A"]'); $(".code", sec).value = q0; $(".load", sec).click(); }
</script>
