<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1監督">
<meta name="theme-color" content="#15151e">
<title>F1チーム監督</title>
<style>
:root { --bg:#eceef2; --card:#fff; --ink:#15151e; --muted:#69707d; --line:#dde1e7; --head:#15151e; --acc:#e10600; --good:#1d8a46; --bad:#c0392b; --chip:#f0f2f6; --asph:#3a3f48; --grass:#1f5f34; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d0f14; --card:#181b23; --ink:#eef0f4; --muted:#9aa2b0; --line:#2a2f3b; --head:#0a0b10; --chip:#232733; --grass:#173f26; } }
:root[data-theme="dark"] { --bg:#0d0f14; --card:#181b23; --ink:#eef0f4; --muted:#9aa2b0; --line:#2a2f3b; --head:#0a0b10; --chip:#232733; --grass:#173f26; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:15px; line-height:1.5; }
header { position:sticky; top:0; z-index:5; background:var(--head); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; align-items:center; gap:10px; border-bottom:3px solid var(--acc); }
header .crest { width:10px; height:30px; border-radius:3px; flex:none; }
header .t { flex:1; min-width:0; } header .t b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } header .t small { opacity:.75; font-size:12px; }
header .money { font-size:13px; text-align:right; }
main { max-width:760px; margin:0 auto; padding:12px 12px calc(env(safe-area-inset-bottom) + 84px); }
nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav.tabs button { flex:1; background:none; border:0; color:var(--muted); font-size:11px; padding:8px 0 7px; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
nav.tabs button .ic { font-size:19px; line-height:1; } nav.tabs button.on { color:var(--acc); font-weight:700; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
.card h3 { margin:0 0 8px; font-size:15px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .sp { flex:1; }
.muted { color:var(--muted); } .small { font-size:12px; } .good { color:var(--good); } .bad { color:var(--bad); }
button.b { font-family:inherit; font-size:14px; border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:9px; padding:8px 12px; }
button.p { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:700; }
button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
button.big { width:100%; padding:13px; font-size:16px; } button:disabled { opacity:.45; }
select, input[type=text], input[type=number] { font-family:inherit; font-size:15px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
input[type=number] { width:64px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
th { color:var(--muted); font-weight:600; font-size:12px; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
tr.me td { background:color-mix(in srgb, var(--acc) 12%, transparent); font-weight:700; }
.tbar { display:inline-block; width:4px; height:14px; border-radius:2px; vertical-align:middle; margin-right:5px; }
.ty { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-size:10px; font-weight:800; border:3px solid; background:#111; color:#fff; vertical-align:middle; }
.stat { display:grid; grid-template-columns:96px 1fr 34px; gap:6px; align-items:center; font-size:13px; margin:5px 0; }
.bar { height:7px; border-radius:4px; background:var(--chip); overflow:hidden; } .bar i { display:block; height:100%; background:var(--acc); }
.modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--card); width:100%; max-width:760px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 14px calc(env(safe-area-inset-bottom) + 16px); }
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:30; background:rgba(15,17,22,.92); color:#fff; padding:9px 14px; border-radius:10px; font-size:14px; max-width:90%; }
canvas#trk { width:100%; display:block; border-radius:10px; background:var(--grass); }
.tower { font-size:12.5px; } .tower td { padding:4px 3px; }
.tower tr.me td { background:color-mix(in srgb, var(--acc) 14%, transparent); }
.flag { padding:6px 10px; border-radius:8px; font-weight:700; text-align:center; margin-bottom:6px; }
.flag.sc { background:#f2c230; color:#111; } .flag.rain { background:#1f6fe0; color:#fff; } .flag.fin { background:#111; color:#fff; }
.ctl { border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:8px; }
.seg { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
.seg button { font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:5px 11px; }
.seg button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
.feed { max-height:170px; overflow:auto; font-size:12.5px; } .feed div { padding:3px 0; border-bottom:1px dashed var(--line); } .feed .m { font-weight:700; }
.pick { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
.stars { color:#d4a017; letter-spacing:1px; }
.hint { font-size:12px; color:var(--muted); margin:6px 0 0; }
.stop { display:flex; gap:6px; align-items:center; margin:4px 0; }
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<script>
/* ===== F1チーム監督：ゲームの中身（画面に触らない） ===== */
"use strict";
const F1 = (() => {
  // ---- 乱数（セーブに状態を残す） ----
  let RS = 1;
  const rnd = () => { RS = (RS + 0x6D2B79F5) | 0; let t = Math.imul(RS ^ (RS >>> 15), 1 | RS); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  // ---- 名前・チーム・コース ----
  const FIRST = "ルカ マックス オリバー ノア レオ ハーヴェイ セバスチャン マテオ アントン ニコ ラファエル ジャック ユウキ ソウタ カイト リアム ダニエル アレックス マルコ フェリックス テオ エミル ヴィクトル トマス アドリアン ケンジ".split(" ");
  const LAST = "ベルナール ハートマン コスタ リンドクヴィスト オコナー ヴァレンティ ノヴァク フィッシャー ロッシ デュボワ サンドバル ミラー 早瀬 桐生 神崎 ブラント ケラー モロー アルヴェス ペトロフ ヴァイス ストーン ラングレー 城戸 マルティネス ホルム".split(" ");
  const TEAMS = [["アストラ", "#c8102e", "#ffffff"], ["ノヴァ", "#0a66c2", "#ffd200"], ["ヴェルデ", "#0b8a4a", "#ffffff"], ["ソラリス", "#ff7a00", "#1a1a1a"], ["ヘリオス", "#e8c600", "#1a1a1a"], ["ブラックバード", "#1a1a1a", "#e10600"], ["コバルト", "#1d3a8a", "#69c3ff"], ["シルバーライン", "#b8bec6", "#0b2a5b"], ["マゼンタ", "#d6338a", "#ffffff"], ["ターコイズ", "#11a6a6", "#ffffff"]];
  const SUF = ["レーシング", "モータースポーツ", "GP", "F1チーム", "グランプリ"];
  // 架空のコース：pw＝パワー寄り(0〜1)、ovt＝抜きやすさ、wear＝タイヤの減り、pit＝ピットロス秒、sc＝周ごとのSC確率、rain＝雨の確率
  const TRACKS = [
    ["オーシャンベイ", 58, 82.5, 0.45, 0.55, 1.0, 21, 0.010, 0.15], ["サンドデューン", 57, 92.0, 0.6, 0.7, 1.15, 23, 0.006, 0.02], ["チェリーヒル", 53, 90.5, 0.4, 0.45, 1.05, 22, 0.008, 0.25],
    ["ハーバーシティ", 63, 96.0, 0.35, 0.25, 0.85, 19, 0.016, 0.15], ["アルペンリンク", 71, 66.0, 0.55, 0.6, 1.1, 20, 0.007, 0.3], ["ローズウッド", 66, 76.5, 0.5, 0.4, 0.95, 21, 0.009, 0.2],
    ["モナルカ市街地", 78, 72.5, 0.2, 0.1, 0.7, 20, 0.020, 0.15], ["フォレストパーク", 52, 87.0, 0.45, 0.5, 1.2, 22, 0.008, 0.35], ["ハイスピードオーバル", 53, 81.0, 0.85, 0.8, 0.9, 24, 0.005, 0.1],
    ["グランドキャニオン", 56, 95.5, 0.65, 0.65, 1.0, 22, 0.007, 0.05], ["ミストレイク", 70, 78.0, 0.4, 0.5, 1.05, 21, 0.009, 0.4], ["サクラ鈴原", 53, 91.5, 0.35, 0.35, 1.25, 22, 0.008, 0.3],
    ["デザートナイト", 50, 99.5, 0.6, 0.6, 1.05, 21, 0.012, 0.0], ["バレーサーキット", 71, 71.0, 0.5, 0.65, 0.95, 21, 0.010, 0.3], ["マリーナ夜市街地", 62, 98.0, 0.3, 0.2, 0.9, 22, 0.018, 0.1], ["ファイナルベイ", 58, 85.5, 0.55, 0.6, 1.0, 22, 0.008, 0.05]
  ].map((t, i) => ({ id: i, name: t[0] + " GP", laps: t[1], base: t[2], pw: t[3], ovt: t[4], wear: t[5], pit: t[6], sc: t[7], rain: t[8], seed: 1000 + i * 37 }));

  // タイヤ：off＝新品のタイム差、deg＝1周ごとに遅くなる秒、life＝崖までの周
  const TYRE = { S: { n: "ソフト", off: -0.75, deg: 0.085, life: 17, col: "#e10600" }, M: { n: "ミディアム", off: 0, deg: 0.05, life: 27, col: "#ffd200" }, H: { n: "ハード", off: 0.6, deg: 0.03, life: 40, col: "#f2f2f2" }, I: { n: "インター", off: 0, deg: 0.04, life: 30, col: "#2bb24c" }, W: { n: "ウェット", off: 0, deg: 0.03, life: 35, col: "#1f6fe0" } };
  const PACE = { push: { t: -0.3, w: 1.4, n: "攻める" }, norm: { t: 0, w: 1, n: "普通" }, save: { t: 0.35, w: 0.68, n: "守る" } };
  const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

  let uid = 1;
  const newDriver = (lvl, ageMin, ageMax) => ({ id: uid++, name: pick(FIRST) + "・" + pick(LAST), age: ri(ageMin, ageMax), pace: clamp(Math.round(lvl + gauss() * 4), 55, 97), cons: clamp(Math.round(lvl + gauss() * 6), 50, 97), tm: clamp(Math.round(lvl + gauss() * 7), 45, 97), craft: clamp(Math.round(lvl + gauss() * 6), 45, 97), wet: clamp(Math.round(lvl + gauss() * 8), 40, 98), pts: 0, wins: 0, podiums: 0, career: { starts: 0, wins: 0, titles: 0 }, contract: ri(1, 3) });
  const newTeam = (i, t, lvl) => ({ id: i, name: t[0] + " " + pick(SUF), color: t[1], color2: t[2], car: { aero: clamp(Math.round(lvl + gauss() * 3), 50, 95), power: clamp(Math.round(lvl + gauss() * 3), 50, 95), chassis: clamp(Math.round(lvl + gauss() * 3), 50, 95), rel: clamp(Math.round(lvl + 4 + gauss() * 4), 55, 98) }, budget: Math.round(60 + lvl * 1.2), drivers: [newDriver(lvl + 3, 22, 34).id, newDriver(lvl - 2, 19, 30).id], pts: 0, hist: [], devQ: [] });

  let S = null;
  const team = id => S.teams[id];
  const me = () => S.teams[S.my];
  const drv = id => S.drivers[id];

  function newGame(seed) {
    RS = (seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0); uid = 1;
    S = { v: 1, season: 1, round: 0, my: null, drivers: {}, teams: [], free: [], news: [], history: [], race: null, last: null };
    const order = TEAMS.slice().sort(() => rnd() - 0.5);
    order.forEach((t, i) => {
      const lvl = 81 - i * 1.0 + ri(-1, 1), tm = { id: i, name: t[0] + " " + pick(SUF), color: t[1], color2: t[2], car: { aero: 0, power: 0, chassis: 0, rel: 0 }, budget: 0, drivers: [], pts: 0, hist: [] };
      tm.car = { aero: clamp(Math.round(lvl + gauss() * 3), 50, 95), power: clamp(Math.round(lvl + gauss() * 3), 50, 95), chassis: clamp(Math.round(lvl + gauss() * 3), 50, 95), rel: clamp(Math.round(lvl + 4 + gauss() * 4), 55, 98) };
      tm.budget = Math.round(70 + (10 - i) * 6); // 百万ドル
      const d1 = newDriver(lvl + 2, 22, 34), d2 = newDriver(lvl - 3, 19, 29); S.drivers[d1.id] = d1; S.drivers[d2.id] = d2; tm.drivers = [d1.id, d2.id];
      S.teams.push(tm);
    });
    for (let k = 0; k < 6; k++) { const d = newDriver(ri(68, 80), 18, 32); S.drivers[d.id] = d; S.free.push(d.id); }
    S.calendar = TRACKS.map(t => t.id);
    return S;
  }
  function chooseTeam(id) { S.my = id; news("あなたは " + me().name + " の代表に就任しました。"); save(); }

  // ---- 速さ ----
  const carPace = (tm, tr) => { const c = tm.car; return c.power * tr.pw + c.aero * (1 - tr.pw) * 0.75 + c.chassis * (0.25 + (1 - tr.pw) * 0.0); };
  // 1周の基準タイムからの差（秒、マイナスが速い）
  const perfDelta = (tm, d, tr) => (75 - carPace(tm, tr)) * 0.045 + (82 - d.pace) * 0.03;

  // おすすめ戦略：1ストップと2ストップを見積もって速い方
  function stintCost(comp, laps, tr, tmF) { const T = TYRE[comp], w = tr.wear * (tmF || 1); let c = T.off * laps + T.deg * w * laps * (laps - 1) / 2; const life = T.life / w; if (laps > life) c += (laps - life) * (laps - life + 1) / 2 * 0.25; return c; }
  function bestPlan(tr, d, wet) {
    if (wet) return { start: wet > 0.65 ? "W" : "I", stops: [] };
    const L = tr.laps, tmF = 1.12 - d.tm / 250, cands = [];
    const C = ["S", "M", "H"];
    for (const a of C) for (const b of C) { if (a === b) continue; for (let x = 8; x <= L - 8; x++) cands.push({ cost: stintCost(a, x, tr, tmF) + stintCost(b, L - x, tr, tmF) + tr.pit, plan: { start: a, stops: [{ lap: x, comp: b }] } }); }
    for (const a of C) for (const b of C) for (const c of C) { if (a === b && b === c) continue; for (let x = 7; x <= L - 14; x += 2) for (let y = x + 7; y <= L - 7; y += 2) cands.push({ cost: stintCost(a, x, tr, tmF) + stintCost(b, y - x, tr, tmF) + stintCost(c, L - y, tr, tmF) + tr.pit * 2, plan: { start: a, stops: [{ lap: x, comp: b }, { lap: y, comp: c }] } }); }
    cands.sort((p, q) => p.cost - q.cost);
    const best = cands[0], two = cands.find(c => c.plan.stops.length === 2), one = cands.find(c => c.plan.stops.length === 1);
    return Object.assign({}, best.plan, { est: { one: one && one.cost, two: two && two.cost } });
  }
  const planCost = (plan, tr, d) => { const tmF = 1.12 - d.tm / 250; let prev = 0, comp = plan.start, c = 0; plan.stops.forEach(s => { c += stintCost(comp, s.lap - prev, tr, tmF) + tr.pit; prev = s.lap; comp = s.comp; }); return c + stintCost(comp, tr.laps - prev, tr, tmF); };

  // ---- レース ----
  function track() { return TRACKS[S.calendar[S.round]]; }
  function setupRace() {
    const tr = track(), wetStart = rnd() < tr.rain * 0.35 ? 0.3 + rnd() * 0.5 : 0;
    const willRain = !wetStart && rnd() < tr.rain;
    const R = { tr: tr.id, lap: 0, t: 0, laps: tr.laps, wet: wetStart, rainAt: willRain ? ri(Math.round(tr.laps * 0.2), Math.round(tr.laps * 0.7)) : -1, rainTo: willRain ? 0.35 + rnd() * 0.5 : 0, rainLen: ri(8, 20), sc: null, scCount: 0, finished: false, flag: false, cars: [], feed: [], alerts: [] };
    // 予選
    const q = [];
    S.teams.forEach(tm => tm.drivers.forEach(id => { const d = drv(id); const lap = tr.base + perfDelta(tm, d, tr) + TYRE.S.off + gauss() * (0.12 + (100 - d.cons) / 400) + (R.wet ? (1 - d.wet / 100) * 4 * R.wet : 0); q.push({ id, tm: tm.id, q: lap }); }));
    q.sort((a, b) => a.q - b.q);
    q.forEach((x, i) => {
      const d = drv(x.id), plan = x.tm === S.my && S.plans && S.plans[x.id] ? JSON.parse(JSON.stringify(S.plans[x.id])) : aiPlan(tr, d, R.wet);
      R.cars.push({ id: x.id, tm: x.tm, grid: i + 1, q: x.q, lap: 0, lapStart: 0, lapEnd: 0, lt: 0, tot: 0, comp: plan.start, age: 0, pace: "norm", plan, stopsDone: 0, pitReq: null, out: false, why: "", pits: 0, best: 999, pos: i + 1, fin: false, finT: 0, used: [plan.start], lastPit: -9 });
    });
    S.race = R; return R;
  }
  function aiPlan(tr, d, wet) { const p = bestPlan(tr, d, wet); if (!wet && rnd() < 0.35 && p.stops.length) { p.stops.forEach(s => s.lap = clamp(s.lap + ri(-3, 3), 5, tr.laps - 5)); } return { start: p.start, stops: p.stops }; }

  const carAt = (R, id) => R.cars.find(c => c.id === id);
  const order = R => R.cars.filter(c => !c.out).sort((a, b) => (b.fin - a.fin) || b.lap - a.lap || (a.fin ? a.finT - b.finT : a.tot - b.tot) || a.grid - b.grid).concat(R.cars.filter(c => c.out).sort((a, b) => b.lap - a.lap));

  function lapTime(R, c) {
    const tr = TRACKS[R.tr], tm = team(c.tm), d = drv(c.id), T = TYRE[c.comp], pm = PACE[c.pace];
    const wearMul = tr.wear * pm.w * (1.12 - d.tm / 250) * (c.comp === "I" || c.comp === "W" ? (R.wet < 0.25 ? 3 : 1) : 1);
    let t = tr.base + perfDelta(tm, d, tr) + T.off + T.deg * c.age * wearMul + pm.t;
    const life = T.life / (tr.wear * pm.w); if (c.age > life) t += (c.age - life) * 0.3;
    t += 3.2 * (1 - c.lap / R.laps); // 燃料
    // 雨
    const w = R.wet; t += w * 7 * (1.25 - d.wet / 160);
    if (c.comp === "S" || c.comp === "M" || c.comp === "H") t += Math.max(0, w - 0.15) * 16;
    else if (c.comp === "I") t += Math.abs(w - 0.45) * 5 + (w < 0.2 ? (0.2 - w) * 12 : 0);
    else t += (1 - w) * 5.5;
    t += gauss() * (0.1 + (100 - d.cons) / 320);
    return t;
  }

  // 1台が周回を終えたときの処理（ピット・次の周・抜き合い）
  function crossLine(R, c) {
    const tr = TRACKS[R.tr];
    c.lap++; c.age++; c.tot = c.lapEnd;
    if (c.lap > 0 && c.lt > 0 && c.lt < c.best) c.best = c.lt;
    // チェッカー
    if (R.flag) { c.fin = true; c.finT = c.lapEnd; return; }
    if (c.lap >= R.laps) { R.flag = true; c.fin = true; c.finT = c.lapEnd; say(R, "🏁 " + drv(c.id).name + " がトップでチェッカー"); return; }
    // 故障・ミス
    const tm = team(c.tm), d = drv(c.id);
    const pFail = (100 - tm.car.rel) / 100 * 0.007 + (100 - d.cons) / 100 * 0.0018 * (c.pace === "push" ? 2 : 1) + R.wet * 0.0015;
    if (rnd() < pFail) { c.out = true; c.why = rnd() < 0.6 ? "マシントラブル" : "クラッシュ"; say(R, "❌ " + d.name + " リタイア（" + c.why + "）", c.tm === S.my); if (c.why === "クラッシュ" && !R.sc && rnd() < 0.6) startSC(R); if (c.tm === S.my) R.alerts.push({ k: "dnf", id: c.id }); return; }
    // ピット判断
    let pitTo = null;
    if (c.pitReq) { pitTo = c.pitReq; c.pitReq = null; }
    else if (!(c.tm === S.my && c.manual)) {
      const nx = c.plan.stops[c.stopsDone];
      if (nx && c.lap >= nx.lap) pitTo = nx.comp;
      if (c.tm !== S.my || c.autoReact) pitTo = aiReact(R, c, pitTo);
    }
    let extra = 0;
    if (pitTo && R.laps - c.lap >= 1) {
      const loss = (R.sc ? tr.pit * 0.5 : tr.pit) + 2.3 + (rnd() < 0.04 ? ri(2, 6) : 0);
      extra = loss; c.comp = pitTo; c.age = 0; c.pits++; c.lastPit = c.lap; if (!c.used.includes(pitTo)) c.used.push(pitTo);
      if (c.plan.stops[c.stopsDone] && c.lap >= c.plan.stops[c.stopsDone].lap - 6) c.stopsDone++;
      say(R, "🔧 L" + c.lap + " " + d.name + " ピットイン → " + TYRE[pitTo].n + "（" + loss.toFixed(1) + "秒）", c.tm === S.my);
    }
    // 次の周
    let lt = lapTime(R, c) + extra;
    if (R.sc) lt = Math.max(lt, tr.base * 1.38);
    let end = c.lapEnd + lt;
    // 前の車（同じ周回で直前に線を越えた車）
    const ahead = R.cars.filter(o => o !== c && !o.out && !o.fin && o.lap === c.lap && o.tot <= c.tot).sort((a, b) => b.tot - a.tot)[0];
    if (ahead) {
      const gap = c.tot - ahead.tot;
      if (R.sc) end = Math.max(end, ahead.lapEnd + 0.6);
      else if (gap < 1.2 && end < ahead.lapEnd + 0.25 && !extra) {
        const dd = drv(c.id), da = drv(ahead.id), adv = ahead.lapEnd - end;
        const p = clamp(tr.ovt * (0.25 + adv * 0.9) * (0.75 + (dd.craft - da.craft) / 150), 0, 0.95);
        if (rnd() < p) { if (end > ahead.lapEnd - 0.1) end = ahead.lapEnd - 0.1; ahead.lapEnd += 0.25; if (c.tm === S.my || ahead.tm === S.my) say(R, "⚔ L" + (c.lap + 1) + " " + dd.name + " が " + da.name + " を抜いた", true); }
        else end = Math.max(end, ahead.lapEnd + 0.3);
      }
    }
    c.lt = end - c.lapEnd; c.lapStart = c.lapEnd; c.lapEnd = end;
    // リーダーの周でコース状況を進める
    if (isLeader(R, c)) leaderLap(R);
  }
  const isLeader = (R, c) => { const o = R.cars.filter(x => !x.out); return o.every(x => x === c || x.lap < c.lap || (x.lap === c.lap && x.tot > c.tot)); };
  function leaderLap(R) {
    R.lap++;
    const tr = TRACKS[R.tr];
    if (R.sc) { R.sc.left--; if (R.sc.left <= 0) { R.sc = null; say(R, "🟢 L" + R.lap + " セーフティカーが戻り、レース再開"); } }
    else if (R.lap > 1 && R.lap < R.laps - 2 && rnd() < tr.sc) startSC(R);
    // 雨
    if (R.rainAt > 0) {
      if (R.lap === R.rainAt) { say(R, "🌧 L" + R.lap + " 雨が降り始めた", true); R.alerts.push({ k: "rain" }); }
      if (R.lap >= R.rainAt && R.lap < R.rainAt + R.rainLen) R.wet = Math.min(R.rainTo, R.wet + 0.07);
      else if (R.lap >= R.rainAt + R.rainLen && R.wet > 0) { const was = R.wet; R.wet = Math.max(0, R.wet - 0.05); if (was >= 0.2 && R.wet < 0.2) { say(R, "☀ L" + R.lap + " 路面が乾いてきた", true); R.alerts.push({ k: "dry" }); } }
    } else if (R.wet > 0) { const was = R.wet; R.wet = Math.max(0, R.wet - 0.04); if (was >= 0.2 && R.wet < 0.2) { say(R, "☀ L" + R.lap + " 路面が乾いてきた", true); R.alerts.push({ k: "dry" }); } }
  }
  function startSC(R) { R.sc = { left: ri(3, 5) }; R.scCount++; say(R, "🟡 L" + R.lap + " セーフティカー出動（ピットの損失が半分）", true); R.alerts.push({ k: "sc" }); }

  // CPU（と「おまかせ」）の判断：SC で安く入る・雨のタイヤ替え
  function aiReact(R, c, pitTo) {
    const left = R.laps - c.lap, T = TYRE[c.comp], dry = c.comp === "S" || c.comp === "M" || c.comp === "H";
    if (R.wet > 0.3 && dry) return R.wet > 0.7 ? "W" : "I";
    if (R.wet > 0.72 && c.comp === "I") return "W";
    if (R.wet < 0.55 && c.comp === "W") return "I";
    if (R.wet < 0.18 && !dry) return left > 25 ? "M" : left > 14 ? "M" : "S";
    if (R.sc && dry && left > 8 && c.lap - c.lastPit > 4 && c.age > T.life * 0.35) { const nc = left > 30 ? "H" : left > 18 ? "M" : "S"; return nc === c.comp && c.used.length < 2 ? (nc === "H" ? "M" : "H") : nc; }
    if (!pitTo && dry && !R.wet && left <= 3 && c.used.length < 2 && c.lap > 3) return c.comp === "S" ? "M" : "S"; // 2種類使う決まり
    return pitTo;
  }
  const say = (R, t, mine) => { R.feed.unshift({ t, mine: !!mine }); if (R.feed.length > 120) R.feed.length = 120; };

  // 時間を進める（秒）。戻り値：止める理由（アラート）
  function advance(R, dt) {
    if (R.finished) return null;
    if (!R.started) { R.started = true; // スタート：グリッド順に並べて1周目
      R.cars.forEach((c, i) => { c.lapEnd = i * 0.25; c.tot = c.lapEnd; c.lap = -1; c.age = Math.max(0, c.age - 1); });
      R.cars.forEach(c => { c.lap = -1; });
      R.lap = 0; R.cars.slice().sort((a, b) => a.lapEnd - b.lapEnd).forEach(c => { c.lap = -1; crossLine0(R, c); });
      say(R, "🚦 " + TRACKS[R.tr].name + " スタート（" + R.laps + "周）" + (R.wet ? "・ウェット" : ""));
    }
    const target = R.t + dt;
    for (let guard = 0; guard < 5000; guard++) {
      const live = R.cars.filter(c => !c.out && !c.fin); if (!live.length) { R.finished = true; finishRace(R); return { k: "end" }; }
      const nx = live.reduce((a, b) => a.lapEnd < b.lapEnd ? a : b);

      R.t = nx.lapEnd; crossLine(R, nx);
      if (R.alerts.length) { const a = R.alerts.shift(); return a; }
    }
    R.t = target; return null;
  }
  // スタート直後の1周目（ポジションの入れ替わりを少しだけ）

  function finishRace(R) {
    const tr = TRACKS[R.tr];
    const res = R.cars.slice().sort((a, b) => (a.out - b.out) || b.lap - a.lap || a.finT - b.finT || a.lapEnd - b.lapEnd);
    // 2種類使っていない（ドライ）なら失格の代わりに +20秒（簡易）
    res.forEach((c, i) => { c.pos = i + 1; });
    const fl = res.filter(c => !c.out && c.pos <= 10).sort((a, b) => a.best - b.best)[0];
    res.forEach(c => { const d = drv(c.id), tm = team(c.tm); d.career.starts++; if (!c.out && c.pos <= 10) { const p = POINTS[c.pos - 1] + (fl === c ? 1 : 0); d.pts += p; tm.pts += p; c.got = p; } else c.got = 0; if (c.pos === 1 && !c.out) { d.wins++; d.career.wins++; } if (c.pos <= 3 && !c.out) d.podiums++; });
    const winner = res[0];
    const rec = { round: S.round + 1, name: tr.name, winner: drv(winner.id).name, wteam: team(winner.tm).name, fl: fl ? drv(fl.id).name : "-", res: res.map(c => ({ id: c.id, tm: c.tm, pos: c.pos, out: c.out, why: c.why, gap: c.out ? null : c.finT - res[0].finT, lapsDown: res[0].lap - c.lap, pits: c.pits, got: c.got, grid: c.grid })) };
    S.last = rec; S.results = (S.results || []).concat([rec]);
    // 賞金（コンストラクターのポイントで）
    S.teams.forEach(tm => { const got = res.filter(c => c.tm === tm.id).reduce((t, c) => t + c.got, 0); tm.budget += 2 + got * 0.35; });
    news("第" + rec.round + "戦 " + tr.name + "：優勝 " + rec.winner + "（" + rec.wteam + "）");
    S.round++; S.race = null; S.plans = null;
    // CPU の開発
    S.teams.forEach(tm => { if (tm.id !== S.my) aiDevelop(tm); });
    save(); return rec;
  }

  // ---- 開発 ----
  const PARTS = { aero: ["空力", "曲がりの多いコースで速い"], power: ["パワーユニット", "直線の長いコースで速い"], chassis: ["シャシー", "どのコースでも少し速い"], rel: ["信頼性", "マシントラブルが減る"] };
  const devCost = (tm, k) => Math.round(4 + Math.max(0, tm.car[k] - 60) * 0.35);
  function develop(k) { const tm = me(), cost = devCost(tm, k); if (tm.budget < cost) return { ok: false, msg: "予算が足りません（" + money(cost) + "）" }; if (tm.car[k] >= 99) return { ok: false, msg: "これ以上は伸びません" }; tm.budget -= cost; const g = rnd() < 0.15 ? 0 : rnd() < 0.7 ? 1 : 2; tm.car[k] = Math.min(99, tm.car[k] + g); news(PARTS[k][0] + " のアップデート" + (g ? "：+" + g : "は不発でした（効果なし）")); save(); return { ok: true, msg: g ? PARTS[k][0] + " +" + g : "アップデートは不発でした" }; }
  function aiDevelop(tm) { for (let n = 0; n < 3; n++) { const k = pick(["aero", "power", "chassis", "rel", "aero", "chassis"]), cost = devCost(tm, k); if (tm.budget > cost + 10 && rnd() < 0.55) { tm.budget -= cost; tm.car[k] = Math.min(99, tm.car[k] + (rnd() < 0.15 ? 0 : rnd() < 0.7 ? 1 : 2)); } } }

  // ---- シーズン ----
  const driverTable = () => Object.values(S.drivers).filter(d => S.teams.some(t => t.drivers.includes(d.id))).sort((a, b) => b.pts - a.pts || b.wins - a.wins);
  const teamTable = () => S.teams.slice().sort((a, b) => b.pts - a.pts);

    S.history.push(rec); dt[0].career.titles++;
    tt.forEach((tm, i) => { tm.budget += 30 + (10 - i) * 5; tm.hist.push(i + 1); });
    // 規則変更：マシンは平均に少し寄る
    S.teams.forEach(tm => { for (const k of ["aero", "power", "chassis", "rel"]) tm.car[k] = Math.round(tm.car[k] * 0.75 + 72 * 0.25 + gauss() * 1.5); tm.pts = 0; });
    Object.values(S.drivers).forEach(d => { d.age++; d.pts = 0; d.wins = 0; d.podiums = 0; d.contract--; const g = d.age <= 24 ? 2 : d.age <= 28 ? 1 : d.age >= 34 ? -2 : 0; for (const k of ["pace", "cons", "tm", "craft", "wet"]) d[k] = clamp(d[k] + g + Math.round(gauss()), 45, 98); });
    // 契約切れ：CPUは延長か入れ替え
    S.teams.forEach(tm => { if (tm.id === S.my) return; tm.drivers = tm.drivers.map(id => { const d = drv(id); if (d.contract > 0) return id; if (d.age < 35 && rnd() < 0.7) { d.contract = ri(1, 3); return id; } const f = S.free.map(drv).sort((a, b) => b.pace - a.pace)[0]; if (f) { S.free = S.free.filter(x => x !== f.id); S.free.push(id); f.contract = ri(1, 3); news(f.name + " が " + tm.name + " に加入"); return f.id; } d.contract = 1; return id; }); });
    while (S.free.length < 6) { const d = newDriver(ri(66, 80), 18, 24); S.drivers[d.id] = d; S.free.push(d.id); }
    S.season++; S.round = 0; S.results = []; S.last = null;
    news("第" + S.season + "シーズン開幕。マシンは新しい規則で作り直されました。"); save(); return rec;
  }
  function swapDriver(outId, inId) { const tm = me(); if (!S.free.includes(inId)) return { ok: false, msg: "契約できません" }; const d = drv(inId), cost = Math.round(2 + Math.max(0, d.pace - 70) * 0.4); if (tm.budget < cost) return { ok: false, msg: "予算が足りません（" + money(cost) + "）" }; tm.budget -= cost; tm.drivers = tm.drivers.map(x => x === outId ? inId : x); S.free = S.free.filter(x => x !== inId); S.free.push(outId); d.contract = 2; news(d.name + " と契約（" + drv(outId).name + " と交代）"); save(); return { ok: true, msg: d.name + " と契約しました" }; }
  const signCost = id => Math.round(2 + Math.max(0, drv(id).pace - 70) * 0.4);

  // ---- 記録・セーブ ----
  const news = t => { S.news.unshift({ s: S.season, r: S.round, t }); S.news = S.news.slice(0, 60); };
  const money = m => "$" + (Math.round(m * 10) / 10) + "M";
  const KEY = "f1_manager_save_v1";
  function save() { if (!S) return; S.rs = RS; S.uid = uid; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  function load(txt) { try { const d = JSON.parse(txt != null ? txt : localStorage.getItem(KEY) || "null"); if (!d || !d.teams) return false; S = d; RS = d.rs; uid = d.uid; return true; } catch (e) { return false; } }
  function wipe() { try { localStorage.removeItem(KEY); } catch (e) { } S = null; }
  const exportSave = () => { save(); return JSON.stringify(S); };

  return { newGame, chooseTeam, setupRace, advance, order, carAt, bestPlan, planCost, aiPlan, develop, devCost, PARTS, driverTable, teamTable, teamOf, endSeason, swapDriver, signCost, track, TRACKS, TYRE, PACE, POINTS, perfDelta, carPace, team, drv, me, money, save, load, wipe, exportSave, get S() { return S; }, rnd };
})();

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const U = { tab: "home", sub: {}, speed: 1, paused: true, raf: 0, last: 0 };
const TABS = [["home", "🏠", "ホーム"], ["race", "🏁", "レース"], ["car", "🔧", "マシン"], ["team", "👤", "チーム"], ["table", "🏆", "順位"]];
const S = () => F1.S, ME = () => F1.me(), money = F1.money;
const SPEEDS = { 1: 40, 3: 120, 10: 400 };
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
const ty = c => { const T = F1.TYRE[c]; return `<span class="ty" style="border-color:${T.col}">${c}</span>`; };
const tbar = tm => `<span class="tbar" style="background:${esc(tm.color)}"></span>`;
function modal(html, noClose) { closeModal(); const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = `<div class="sheet">${html}</div>`; m.onclick = e => { if ((!noClose && e.target === m) || e.target.hasAttribute("data-x")) closeModal(); }; document.body.appendChild(m); }
function closeModal() { const m = document.getElementById("modal"); if (m) m.remove(); }

/* ---------- 起動 ---------- */
function boot() { if (F1.load()) { if (S().my == null) pickTeam(); else render(); } else startScreen(); }
function startScreen() {
  $("#hd").innerHTML = `<div class="t"><b>F1チーム監督</b><small>戦略で勝ち取れ</small></div>`; $("#tabs").innerHTML = "";
  $("#main").innerHTML = `<div class="card"><h3>新しく始める</h3><p class="small muted">架空のF1シリーズ（10チーム・全16戦）で、1チームの代表兼ストラテジストになります。レースではタイヤ戦略・ピットのタイミング・ペースを指示し、セーフティカーや雨に対応して順位を上げてください。レースの間はマシンを開発します。</p><button class="b p big" id="ng">シリーズを作る</button></div>
  <div class="card"><h3>セーブデータを読み込む</h3><textarea id="imp" style="width:100%;height:70px" placeholder="書き出したセーブデータを貼り付け"></textarea><button class="b" id="impb">読み込む</button></div>`;
  $("#ng").onclick = () => { F1.newGame(); pickTeam(); };

}
function pickTeam() {

  $("#hd").innerHTML = `<div class="t"><b>チームを選ぶ</b><small>★が少ないほど難しい</small></div>`;
  $("#main").innerHTML = `<div class="card">${S().teams.map(t => `<div class="pick">${tbar(t)}<div class="sp"><b>${esc(t.name)}</b><div class="small muted">マシン <span class="stars">${"★".repeat(st(t))}${"☆".repeat(5 - st(t))}</span>・予算 ${money(t.budget)}<br>${t.drivers.map(id => esc(F1.drv(id).name)).join("／")}</div></div><button class="b" data-t="${t.id}">選ぶ</button></div>`).join("")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { F1.chooseTeam(+b.dataset.t); U.tab = "home"; render(); toast(ME().name + " の代表に就任しました"); });
}

/* ---------- 共通 ---------- */

  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (U.tab === "race" && b.dataset.tab !== "race") pauseRace(); U.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  ({ home: vHome, race: vRace, car: vCar, team: vTeam, table: vTable })[U.tab]();
}
function trackInfo(tr) {

  return `<div class="small muted">${tr.laps}周・ピットロス約${tr.pit}秒・${lv(tr.pw, ["曲がりの多いコース", "バランス型", "直線の長いコース"])}・抜きやすさ ${lv(tr.ovt, ["低", "中", "高"])}・タイヤの減り ${tr.wear < 0.9 ? "少" : tr.wear < 1.1 ? "中" : "多"}・雨の確率 ${Math.round(tr.rain * 100)}%</div>`;
}

/* ---------- ホーム ---------- */
function vHome() {

  ${done ? `<div class="card"><h3>シーズン終了</h3><p class="small muted">全16戦が終わりました。表彰とマシンの規則変更、ドライバーの契約の処理をします。</p><button class="b p big" id="endS">シーズンを終える</button></div>`
  : `<div class="card"><h3>第${s.round + 1}戦　${esc(tr.name)}</h3>${trackInfo(tr)}
     <div class="stat" style="margin-top:8px"><span class="small muted">自分のマシン</span><div class="bar"><i style="width:${Math.round((F1.carPace(t, tr) - 50) / 45 * 100)}%"></i></div><span class="small">${Math.round(F1.carPace(t, tr))}</span></div>
     <p class="hint">このコースでの速さ。トップは ${Math.round(Math.max(...s.teams.map(x => F1.carPace(x, tr))))}。</p>
     <button class="b p big" id="quali" style="margin-top:6px">予選を走る</button></div>`}
  ${s.last ? `<div class="card"><h3>前戦 ${esc(s.last.name)}</h3><table>${s.last.res.slice(0, 10).map(r => resRow(r)).join("")}${s.last.res.filter(r => r.tm === s.my && r.pos > 10).map(r => resRow(r)).join("")}</table></div>` : ""}
  <div class="card"><h3>コンストラクター</h3><table>${tt.map((x, i) => `<tr class="${x.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(x)}${esc(x.name)}</td><td class="n">${x.pts}</td></tr>`).join("")}</table></div>

let geo = null;

function vTeam() {
  const t = ME(), s = S();
  const dcard = id => { const d = F1.drv(id); const bar = (l, v) => `<div class="stat"><span class="small muted">${l}</span><div class="bar"><i style="width:${v}%"></i></div><span class="small">${v}</span></div>`; return `<div class="card"><div class="row"><b class="sp">${esc(d.name)}</b><span class="small muted">${d.age}歳・契約残り${d.contract}年</span></div>${bar("速さ", d.pace)}${bar("安定感", d.cons)}${bar("タイヤ管理", d.tm)}${bar("バトル", d.craft)}${bar("雨", d.wet)}<p class="small muted">今季 ${d.pts}点・${d.wins}勝・表彰台${d.podiums}回／通算 ${d.career.starts}戦 ${d.career.wins}勝・タイトル${d.career.titles}回</p><div class="row"><input type="text" value="${esc(d.name)}" id="rn${id}" class="sp"><button class="b" data-rn="${id}">名前を変える</button></div></div>`; };
  $("#main").innerHTML = t.drivers.map(dcard).join("") + `
  <div class="card"><h3>空いているドライバー</h3><p class="small muted">契約金を払って、今のドライバーと入れ替えられます。</p>${s.free.map(id => { const d = F1.drv(id); return `<div class="pick"><div class="sp"><b>${esc(d.name)}</b><div class="small muted">${d.age}歳・速さ${d.pace} 安定${d.cons} タイヤ${d.tm} バトル${d.craft} 雨${d.wet}</div></div><select data-sw="${id}"><option value="">入れ替え…</option>${t.drivers.map(x => `<option value="${x}">${esc(F1.drv(x).name)} と（${money(F1.signCost(id))}）</option>`).join("")}</select></div>`; }).join("")}</div>
  <div class="card"><h3>チーム名・カラー</h3><div class="row"><input type="text" id="tn" value="${esc(t.name)}" class="sp"><button class="b" id="tnb">変える</button></div><div class="row" style="margin-top:8px"><span class="small">メイン</span><input type="color" id="c1" value="${esc(t.color)}"><span class="small">サブ</span><input type="color" id="c2" value="${esc(t.color2)}"><button class="b" id="cb">色を変える</button></div>
  <p class="hint">ほかのチームの名前も変えられます：</p><div class="row"><select id="ot">${s.teams.filter(x => x.id !== t.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><input type="text" id="otn" placeholder="新しい名前" class="sp"><button class="b" id="otb">変える</button></div></div>
  <div class="card"><h3>セーブ</h3><p class="small muted">進み具合はこの端末のブラウザに自動で保存されます。別の端末に移すときは書き出してください。</p><div class="row"><button class="b" id="ex">セーブデータを書き出す</button><button class="b" id="restart">最初からやり直す</button></div><textarea id="exo" style="width:100%;height:70px;margin-top:8px;display:none" readonly></textarea></div>
  <div class="card"><h3>戦略のコツ</h3><ul class="small muted" style="margin:0;padding-left:1.2em"><li>ソフトは速いが減りが早い。崖（急に遅くなる周）を越える前に替えるのが基本。</li><li>セーフティカー中はピットの損失が半分。タイヤが古ければ入りどき。</li><li>抜きにくいコースでは、前に出るためにピットを早めて前の車を飛び越える（アンダーカット）。</li><li>「守る」ペースはタイヤが長持ちする代わりに遅い。1ストップを狙うときに。</li><li>ホーム画面に追加すると、アプリのように起動できます。</li></ul></div>`;
  document.querySelectorAll("[data-rn]").forEach(b => b.onclick = () => { const id = +b.dataset.rn, v = $("#rn" + id).value.trim(); if (v) { F1.drv(id).name = v.slice(0, 24); F1.save(); render(); toast("名前を変えました"); } });
  document.querySelectorAll("[data-sw]").forEach(sel => sel.onchange = () => { if (!sel.value) return; if (S().race) { toast("レース週末中は入れ替えできません"); render(); return; } const r = F1.swapDriver(+sel.value, +sel.dataset.sw); toast(r.msg); render(); });
  $("#tnb").onclick = () => { const v = $("#tn").value.trim(); if (v) { t.name = v.slice(0, 24); F1.save(); render(); } };
  $("#cb").onclick = () => { t.color = $("#c1").value; t.color2 = $("#c2").value; F1.save(); render(); };
  $("#otb").onclick = () => { const o = F1.team(+$("#ot").value), v = $("#otn").value.trim(); if (o && v) { o.name = v.slice(0, 24); F1.save(); render(); toast("名前を変えました"); } };
  $("#ex").onclick = () => { const x = $("#exo"); x.style.display = ""; x.value = F1.exportSave(); x.select(); try { navigator.clipboard.writeText(x.value); toast("コピーしました"); } catch (e) { } };
  $("#restart").onclick = () => { if (confirm("今のセーブを消して最初からやり直しますか？（元に戻せません）")) { F1.wipe(); startScreen(); } };
}

/* ---------- 順位 ---------- */
function vTable() {
  const sub = U.sub.tb || "drv", s = S();
  const seg = `<div class="seg">${[["drv", "ドライバー"], ["con", "コンストラクター"], ["cal", "カレンダー"], ["hist", "歴代"]].map(([k, l]) => `<button class="${sub === k ? "on" : ""}" data-tb="${k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (sub === "drv") body = `<div class="card"><table><tr><th>#</th><th>ドライバー</th><th class="n">勝</th><th class="n">点</th></tr>${F1.driverTable().map((d, i) => { const tm = F1.teamOf(d.id); return `<tr class="${tm.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(tm)}${esc(d.name)}</td><td class="n">${d.wins}</td><td class="n"><b>${d.pts}</b></td></tr>`; }).join("")}</table></div>`;
  else if (sub === "con") body = `<div class="card"><table><tr><th>#</th><th>チーム</th><th class="n">点</th></tr>${F1.teamTable().map((t, i) => `<tr class="${t.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(t)}${esc(t.name)}</td><td class="n"><b>${t.pts}</b></td></tr>`).join("")}</table></div>`;
  else if (sub === "cal") body = `<div class="card"><table>${s.calendar.map((tid, i) => { const tr = F1.TRACKS[tid], r = (s.results || []).find(x => x.round === i + 1); return `<tr class="${i === s.round ? "me" : ""}"><td>${i + 1}</td><td>${esc(tr.name)}</td><td class="small">${r ? "優勝 " + esc(r.winner) : i === s.round ? "次" : ""}</td></tr>`; }).join("")}</table></div>`;
  else body = `<div class="card">${s.history.slice().reverse().map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>第${h.season}シーズン</b><div class="small muted">王者 ${esc(h.champ)}（${esc(h.champTeam)}）・コンストラクター ${esc(h.cons)}・${esc(h.my)} ${h.myRank}位（${h.myPts}点）</div></div>`).join("") || '<p class="muted small">まだ記録がありません</p>'}</div>`;
  $("#main").innerHTML = seg + body;
  document.querySelectorAll("[data-tb]").forEach(b => b.onclick = () => { U.sub.tb = b.dataset.tb; render(); });
}

boot();
</script>
</body>
</html>
