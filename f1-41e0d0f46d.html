<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1監督">
<meta name="theme-color" content="#15151e">
<title>F1チーム監督</title>
<style>
:root { --bg:#eceef2; --card:#fff; --ink:#15151e; --muted:#69707d; --line:#dde1e7; --head:#15151e; --acc:#e10600; --good:#1d8a46; --bad:#c0392b; --chip:#f0f2f6; --asph:#3a3f48; --grass:#1f5f34; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d0f14; --card:#181b23; --ink:#eef0f4; --muted:#9aa2b0; --line:#2a2f3b; --head:#0a0b10; --chip:#232733; --grass:#173f26; } }
:root[data-theme="dark"] { --bg:#0d0f14; --card:#181b23; --ink:#eef0f4; --muted:#9aa2b0; --line:#2a2f3b; --head:#0a0b10; --chip:#232733; --grass:#173f26; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:15px; line-height:1.5; }
header { position:sticky; top:0; z-index:5; background:var(--head); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; align-items:center; gap:10px; border-bottom:3px solid var(--acc); }
header .crest { width:10px; height:30px; border-radius:3px; flex:none; }
header .t { flex:1; min-width:0; } header .t b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } header .t small { opacity:.75; font-size:12px; }
header .money { font-size:13px; text-align:right; }
main { max-width:760px; margin:0 auto; padding:12px 12px calc(env(safe-area-inset-bottom) + 84px); }
nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav.tabs button { flex:1; background:none; border:0; color:var(--muted); font-size:11px; padding:8px 0 7px; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
nav.tabs button .ic { font-size:19px; line-height:1; } nav.tabs button.on { color:var(--acc); font-weight:700; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
.card h3 { margin:0 0 8px; font-size:15px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .sp { flex:1; }
.muted { color:var(--muted); } .small { font-size:12px; } .good { color:var(--good); } .bad { color:var(--bad); }
button.b { font-family:inherit; font-size:14px; border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:9px; padding:8px 12px; }
button.p { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:700; }
button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
button.big { width:100%; padding:13px; font-size:16px; } button:disabled { opacity:.45; }
select, input[type=text], input[type=number] { font-family:inherit; font-size:15px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
input[type=number] { width:64px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
th { color:var(--muted); font-weight:600; font-size:12px; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
tr.me td { background:color-mix(in srgb, var(--acc) 12%, transparent); font-weight:700; }
.tbar { display:inline-block; width:5px; height:14px; border-radius:2px; vertical-align:middle; margin-right:5px; box-shadow:0 0 0 1px rgba(150,150,150,.55); }
.ty { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-size:10px; font-weight:800; border:3px solid; background:#111; color:#fff; vertical-align:middle; }
.stat { display:grid; grid-template-columns:96px 1fr 34px; gap:6px; align-items:center; font-size:13px; margin:5px 0; }
.bar { height:7px; border-radius:4px; background:var(--chip); overflow:hidden; } .bar i { display:block; height:100%; background:var(--acc); }
.modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--card); width:100%; max-width:760px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 14px calc(env(safe-area-inset-bottom) + 16px); }
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:30; background:rgba(15,17,22,.92); color:#fff; padding:9px 14px; border-radius:10px; font-size:14px; max-width:90%; }
canvas#trk { width:100%; display:block; border-radius:10px; background:var(--grass); }
.tower { font-size:12.5px; } .tower td { padding:4px 3px; }
.tower tr.me td { background:color-mix(in srgb, var(--acc) 14%, transparent); }
.flag { padding:6px 10px; border-radius:8px; font-weight:700; text-align:center; margin-bottom:6px; }
.flag.sc { background:#f2c230; color:#111; } .flag.rain { background:#1f6fe0; color:#fff; } .flag.fin { background:#111; color:#fff; }
.ctl { border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:8px; }
.seg { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
.seg button { font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:5px 11px; }
.seg button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
.feed { max-height:170px; overflow:auto; font-size:12.5px; } .feed div { padding:3px 0; border-bottom:1px dashed var(--line); } .feed .m { font-weight:700; }
.pick { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
.stars { color:#d4a017; letter-spacing:1px; }
.hint { font-size:12px; color:var(--muted); margin:6px 0 0; }
.stop { display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; }
.tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:var(--chip); color:var(--ink); margin:2px 4px 2px 0; border:1px solid var(--line); }
.tag.warn { background:#c0392b; color:#fff; border-color:#c0392b; } .tag.gold { background:#d4a017; color:#111; border-color:#d4a017; }
.ag { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px 8px; margin-top:6px; font-size:12px; } .ag div { display:flex; justify-content:space-between; gap:4px; border-bottom:1px dotted var(--line); padding:2px 0; } .ag span { color:var(--muted); }
@media (max-width:420px) { .ag { grid-template-columns:repeat(2, 1fr); } }
.drv { cursor:pointer; } .drv.selc { outline:3px solid var(--acc); }
.drvm { padding:8px 0; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>

<script>
/* ===== F1チーム監督 v2：ゲームの中身（画面に触らない） ===== */
"use strict";
const F1 = (() => {
  let RS = 1;
  const rnd = () => { RS = (RS + 0x6D2B79F5) | 0; let t = Math.imul(RS ^ (RS >>> 15), 1 | RS); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const r1 = x => Math.round(x * 10) / 10;

  // ---- 名前 ----
  const FIRST = "ルカ マックス オリバー ノア レオ ハーヴェイ セバスチャン マテオ アントン ニコ ラファエル ジャック リアム ダニエル アレックス マルコ フェリックス テオ エミル ヴィクトル トマス アドリアン ジョージ ランド エステバン ピエール ケビン ヤン オスカー ガブリエル アンドレア ミケル カルロス フランコ ルイス ヨナス アーサー ディノ パト リッカルド".split(" ");
  const LAST = "ベルナール ハートマン コスタ リンドクヴィスト オコナー ヴァレンティ ノヴァク フィッシャー ロッシ デュボワ サンドバル ミラー ブラント ケラー モロー アルヴェス ペトロフ ヴァイス ストーン ラングレー マルティネス ホルム ラッセル ガスリー ニールセン シューマン ドゥーハン クラーク リヴィエール ブラウン ソレンセン バルデス フォンテーヌ ヴェルナー アッカーマン ベアード".split(" ");
  const JP = ["早瀬 颯太", "神崎 海斗", "桐生 蓮", "城戸 大翔", "片山 湊"];
  const STAFF_N = "ジェームズ アンドリュー ハンナ エイドリアン マッティア ローラン ジョナサン ピーター シモーネ ルース ベン クリスティアン マリア トト フレッド".split(" ");
  const STAFF_L = "ヒギンズ ボッシ アリソン ステラ ウィートリー モンタニャ グリーン ボウラー フォーリー ホーナー ラッセル ブリーン メキエス ヴォウルズ バッサー".split(" ");

  // ---- エンジン（PU）供給元 ----
  const PU0 = [
    { id: "mz", name: "メルツェン", lvl: 86, dev: 84, fee: 18 },
    { id: "fr", name: "フェラーロ", lvl: 84, dev: 80, fee: 17 },
    { id: "ht", name: "ホンタ", lvl: 82, dev: 82, fee: 16 },
    { id: "fd", name: "フォルド", lvl: 79, dev: 76, fee: 14 },
    { id: "ad", name: "アウダ", lvl: 74, dev: 72, fee: 13 }
  ];
  // ---- チーム（実在に寄せたもじり）：works＝自社PU、budget＝年間予算$M、devp＝車体の開発力、car＝初期の車、strat/crew＝スタッフ ----
  const TEAM0 = [
    { n: "ブルレッド・レーシング", s: "ブルレッド", c: "#1e2a5a", c2: "#e10600", pu: "fd", works: 1, budget: 185, sp: 95, devp: 90, car: 86, strat: 84, crew: 92 },
    { n: "スクーデリア・フェラーロ", s: "フェラーロ", c: "#d40000", c2: "#ffd800", pu: "fr", works: 1, budget: 190, sp: 105, devp: 82, car: 85, strat: 70, crew: 86 },
    { n: "メルツェンAMG", s: "メルツェン", c: "#00a19c", c2: "#d9d9d9", pu: "mz", works: 1, budget: 190, sp: 100, devp: 86, car: 86, strat: 82, crew: 85 },
    { n: "マクレイン", s: "マクレイン", c: "#ff8000", c2: "#1a1a1a", pu: "mz", works: 0, budget: 180, sp: 100, devp: 88, car: 87, strat: 80, crew: 88 },
    { n: "アストン・マーリン", s: "アストン", c: "#00594f", c2: "#cedc00", pu: "ht", works: 1, budget: 185, sp: 85, devp: 74, car: 79, strat: 72, crew: 80 },
    { n: "アルペンF1", s: "アルペン", c: "#0090ff", c2: "#ff87bc", pu: "mz", works: 0, budget: 145, sp: 70, devp: 66, car: 76, strat: 66, crew: 76 },
    { n: "ウィリアムソン", s: "ウィリアムソン", c: "#005aff", c2: "#ffffff", pu: "mz", works: 0, budget: 130, sp: 60, devp: 74, car: 78, strat: 74, crew: 72 },
    { n: "ブル・ジュニア", s: "ジュニア", c: "#6692ff", c2: "#ffffff", pu: "fd", works: 0, budget: 120, sp: 55, devp: 70, car: 77, strat: 71, crew: 78 },
    { n: "ハーツF1", s: "ハーツ", c: "#b6babd", c2: "#da291c", pu: "fr", works: 0, budget: 105, sp: 45, devp: 58, car: 75, strat: 68, crew: 74 },
    { n: "アウダF1", s: "アウダ", c: "#2b2b2b", c2: "#e30613", pu: "ad", works: 1, budget: 170, sp: 75, devp: 64, car: 73, strat: 62, crew: 70 },
    { n: "キャディラ・レーシング", s: "キャディラ", c: "#0d0d0d", c2: "#c9a227", pu: "fr", works: 0, budget: 165, sp: 80, devp: 52, car: 71, strat: 60, crew: 66 }
  ];

  // ---- コース ----
  const TRACKS = [
    ["オーシャンベイ", 58, 82.5, 0.45, 0.55, 1.0, 21, 0.010, 0.15, 1.0], ["サンドデューン", 57, 92.0, 0.6, 0.7, 1.15, 23, 0.006, 0.02, 1.05], ["チェリーヒル", 53, 90.5, 0.4, 0.45, 1.05, 22, 0.008, 0.25, 0.95],
    ["ハーバーシティ", 63, 96.0, 0.35, 0.25, 0.85, 19, 0.016, 0.15, 0.9], ["アルペンリンク", 71, 66.0, 0.55, 0.6, 1.1, 20, 0.007, 0.3, 0.95], ["ローズウッド", 66, 76.5, 0.5, 0.4, 0.95, 21, 0.009, 0.2, 1.0],
    ["モナルカ市街地", 78, 72.5, 0.2, 0.1, 0.7, 20, 0.020, 0.15, 0.85], ["フォレストパーク", 52, 87.0, 0.45, 0.5, 1.2, 22, 0.008, 0.35, 1.0], ["ハイスピードオーバル", 53, 81.0, 0.85, 0.8, 0.9, 24, 0.005, 0.1, 1.15],
    ["グランドキャニオン", 56, 95.5, 0.65, 0.65, 1.0, 22, 0.007, 0.05, 1.1], ["ミストレイク", 70, 78.0, 0.4, 0.5, 1.05, 21, 0.009, 0.4, 1.0], ["サクラ鈴原", 53, 91.5, 0.35, 0.35, 1.25, 22, 0.008, 0.3, 1.05],
    ["デザートナイト", 50, 99.5, 0.6, 0.6, 1.05, 21, 0.012, 0.0, 1.05], ["バレーサーキット", 71, 71.0, 0.5, 0.65, 0.95, 21, 0.010, 0.3, 1.0], ["マリーナ夜市街地", 62, 98.0, 0.3, 0.2, 0.9, 22, 0.018, 0.1, 0.95], ["ファイナルベイ", 58, 85.5, 0.55, 0.6, 1.0, 22, 0.008, 0.05, 1.0]
  ].map((t, i) => ({ id: i, name: t[0] + " GP", laps: t[1], base: t[2], pw: t[3], ovt: t[4], wear: t[5], pit: t[6], sc: t[7], rain: t[8], fuel: t[9], seed: 1000 + i * 37 }));

  const TYRE = { S: { n: "ソフト", off: -0.75, deg: 0.085, life: 17, col: "#e10600" }, M: { n: "ミディアム", off: 0, deg: 0.05, life: 27, col: "#ffd200" }, H: { n: "ハード", off: 0.6, deg: 0.03, life: 40, col: "#f2f2f2" }, I: { n: "インター", off: 0, deg: 0.04, life: 30, col: "#2bb24c" }, W: { n: "ウェット", off: 0, deg: 0.03, life: 35, col: "#1f6fe0" } };
  // ペース：t＝タイム差、w＝タイヤの減り、f＝燃料の使い方
  const PACE = { push: { t: -0.3, w: 1.4, f: 1.05, n: "攻める" }, norm: { t: 0, w: 1, f: 1, n: "普通" }, save: { t: 0.35, w: 0.68, f: 0.97, n: "タイヤを守る" }, lift: { t: 0.22, w: 0.85, f: 0.85, n: "燃料セーブ" } };
  const FUEL = { full: { n: "多め", extra: 1.5 }, std: { n: "標準", extra: 0.3 }, light: { n: "少なめ", extra: -1.6 } };
  const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
  const REG_TYPES = {
    aero: { n: "空力の大改定", d: "車体（空力・シャシー）が作り直しになる。来年の車に投資したチームと、規則変更に強いドライバーが有利。", big: 1 },
    pu: { n: "パワーユニットの大改定", d: "エンジンが作り直しになる。ワークスは来年のPUに投資できる。カスタマーは供給元しだい。", big: 1 },
    cap: { n: "予算上限の見直し", d: "開発に使えるお金の上限が変わる。下がるとお金持ちチームの有利が減る。", big: 0 },
    tyre: { n: "タイヤの性格が変わる", d: "タイヤが減りやすく（または減りにくく）なる。戦略の重みが変わる。", big: 0 },
    fuel: { n: "燃料規制の強化", d: "1レースで使える燃料が減る。燃料セーブの重みが増す。", big: 0 }
  };

  // ---- 生成 ----
  let uid = 1;
  function newDriver(lvl, age, opt) {
    opt = opt || {};
    const st = (v, sd) => clamp(Math.round(v + gauss() * sd), 40, 98);
    const d = { id: uid++, name: opt.name || (pick(FIRST) + "・" + pick(LAST)), age, pace: st(lvl, 4), craft: st(lvl, 6), cons: st(lvl, 6), tm: st(lvl, 7), wet: st(lvl, 9), dev: st(lvl - 4, 10), adapt: st(lvl - 2, 10), calm: st(70, 15), pot: 0, sponsor: 0, salary: 0, contract: ri(1, 3), pts: 0, wins: 0, podiums: 0, career: { starts: 0, wins: 0, titles: 0 } };
    if (opt.perfect) for (const k of ["pace", "craft", "cons", "tm", "wet", "dev", "adapt", "calm"]) d[k] = clamp(ri(90, 96), 40, 98);
    if (opt.hot) d.calm = ri(25, 42);
    if (opt.pay) d.sponsor = ri(8, 25);
    d.pot = age <= 23 ? clamp(d.pace + ri(3, 12), d.pace, 97) : d.pace;
    d.salary = salaryOf(d);
    return d;
  }
  const salaryOf = d => Math.max(1, Math.round(Math.pow(Math.max(0, d.pace - 60), 2) / 28 + (d.career.titles || 0) * 6));
  const traits = d => {
    const t = [];
    if (["pace", "craft", "cons", "tm", "wet", "dev", "adapt", "calm"].every(k => d[k] >= 88)) t.push("完全無欠");
    if (d.wet >= 88) t.push("雨の名手"); if (d.calm <= 45) t.push("カッとなりやすい"); if (d.dev >= 86) t.push("開発上手"); if (d.adapt >= 86) t.push("規則変更に強い");
    if (d.tm >= 88) t.push("タイヤを長持ちさせる"); if (d.craft >= 88) t.push("バトルに強い"); if (d.sponsor) t.push("ペイドライバー（+$" + d.sponsor + "M）"); if (d.age <= 22 && d.pot >= d.pace + 6) t.push("伸びしろ大");
    return t;
  };
  // F2 の若手：今は遅いが伸びしろ（pot）がある
  function newF2Driver(age) { const d = newDriver(ri(60, 70), age, { pay: rnd() < 0.2, hot: rnd() < 0.2, name: rnd() < 0.05 ? pick(JP) : null }); d.pot = clamp(d.pace + ri(6, 24), d.pace, 97); d.f2 = { pts: 0, wins: 0, starts: 0 }; d.salary = 1; S.drivers[d.id] = d; return d; }
  function newStaff(kind, lvl) { return { id: uid++, kind, name: pick(STAFF_N) + "・" + pick(STAFF_L), skill: clamp(Math.round(lvl + gauss() * 5), 45, 97), salary: 0 }; }

  let S = null;
  const team = id => S.teams[id];
  const me = () => S.teams[S.my];
  const drv = id => S.drivers[id];
  const pu = id => S.pus[id];
  const puPower = tm => pu(tm.pu).lvl + (tm.works ? 1.5 : 0);

  function newGame(seed) {
    RS = (seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0); uid = 1;
    S = { v: 2, season: 1, round: 0, my: null, phase: "pick", drivers: {}, teams: [], free: [], staffPool: [], news: [], history: [], race: null, last: null, results: [], pus: {}, regs: { wear: 1, fuel: 1, cap: 150, era: "第1世代" }, nextReg: null, spent: {}, nextInv: {} };
    PU0.forEach(p => S.pus[p.id] = Object.assign({}, p, { nextInv: 0 }));
    TEAM0.forEach((t, i) => {
      const tm = { id: i, name: t.n, short: t.s, color: t.c, color2: t.c2, pu: t.pu, works: !!t.works, budget: t.budget, owner: t.budget - t.sp, sponsor: t.sp, devp: t.devp, car: { aero: clamp(Math.round(t.car + gauss() * 2), 50, 95), chassis: clamp(Math.round(t.car + gauss() * 2), 50, 95), rel: clamp(Math.round(t.car + 2 + gauss() * 3), 55, 98) }, staff: { strat: newStaff("strat", t.strat), crew: newStaff("crew", t.crew) }, drivers: [], pts: 0, hist: [], entrant: false };
      tm.staff.strat.salary = Math.round(tm.staff.strat.skill / 12); tm.staff.crew.salary = Math.round(tm.staff.crew.skill / 14);
      S.teams.push(tm);
    });
    // ドライバー：チームの格に合わせて2人ずつ。完全無欠1人・カッとなる人・ペイドライバー・日本人1人
    const lv = TEAM0.map(t => t.car + 1);

  let body = "";
  if (sub === "drv") {
    body = t.drivers.map(id => { const d = F1.drv(id); return `<div class="card"><div class="row"><b class="sp">${esc(d.name)}</b><span class="small muted">${d.age}歳・契約残り${d.contract}年・年俸${money(d.salary)}</span></div>${attrGrid(d)}<div style="margin-top:4px">${tags(d)}</div><p class="small muted">今季 ${d.pts}点・${d.wins}勝・表彰台${d.podiums}回／通算 ${d.career.starts}戦 ${d.career.wins}勝・タイトル${d.career.titles}回</p></div>`; }).join("")
      + `<div class="card"><h3>空いているドライバー</h3><p class="small muted">契約金（年俸の半分）を払って入れ替え。ペイドライバーはスポンサー資金を持ってくる。レース週末中は入れ替えできません。</p>${s.free.map(id => { const d = F1.drv(id); return `<div class="drvm"><div class="row"><b class="sp">${esc(d.name)}</b><span class="small muted">${d.age}歳・年俸${money(d.salary)}</span></div>${attrGrid(d)}<div style="margin:4px 0">${tags(d)}</div><select data-sw="${id}"><option value="">入れ替える…</option>${t.drivers.map(x => `<option value="${x}">${esc(F1.drv(x).name)} と（契約金 ${money(F1.drv(id).salary * 0.5)}）</option>`).join("")}</select></div>`; }).join("")}</div>`;
  } else if (sub === "f2") {
    const ac = F1.academyOf(t.id), ft = F1.f2Table(), owner = id => { const e = Object.entries(s.academy).find(([k, l]) => l.includes(id)); return e ? F1.team(+e[0]) : null; };
    const pv = d => { const p = F1.potView(d); return p.lo === p.hi ? "伸びしろ " + p.hi : "伸びしろ " + p.lo + "〜" + p.hi + "（推定）"; };
    body = `<div class="card"><h3>自分のジュニア（${ac.length}/3）</h3><p class="small muted">ジュニアは F2 を走りながら、毎年ふつうより少し多く伸びます。F1 に上げるときは契約金なし（今のドライバーは空きに回ります）。F2 を卒業した後もリザーブとして26歳まで残せます。</p>
      ${ac.length ? ac.map(id => { const d = F1.drv(id); return `<div class="drvm"><div class="row"><b class="sp">${esc(d.name)}</b><span class="small muted">${d.age}歳・${d.reserve ? "リザーブ" : "F2 " + d.f2.pts + "点 " + d.f2.wins + "勝"}・${pv(d)}</span></div>${attrGrid(d)}<div style="margin:4px 0">${tags(d)}</div><div class="row"><select data-pro="${id}"><option value="">F1 に上げる…</option>${t.drivers.map(x => `<option value="${x}">${esc(F1.drv(x).name)} と交代</option>`).join("")}</select><button class="b" data-lv="${id}">外す</button></div></div>`; }).join("") : '<p class="small muted">まだいません。下の F2 から選んでください。</p>'}</div>
      <div class="card"><h3>F2 ランキング（第${s.season}シーズン）</h3><p class="small muted">F1 の各戦のあとに1戦。王者と、22歳以上・速い若手は卒業して F1 の空きドライバーに（ジュニアならチームに残る）。伸びしろは自分のジュニアにすると正確に分かります。</p>
      <div style="overflow-x:auto"><table><tr><th>#</th><th>ドライバー</th><th class="n">歳</th><th class="n">速さ</th><th class="n">点</th><th></th></tr>${ft.map((d, i) => { const o = owner(d.id); return `<tr class="${o && o.id === t.id ? "me" : ""}"><td>${i + 1}</td><td>${esc(d.name)}<div class="small muted">${pv(d)}${o ? "・" + esc(o.short) + "のジュニア" : ""}</div></td><td class="n">${d.age}</td><td class="n">${d.pace}</td><td class="n">${d.f2.pts}</td><td>${o ? "" : `<button class="b" data-ja="${d.id}">${money(F1.academyFee(d))}で育成</button>`}</td></tr>`; }).join("")}</table></div></div>
      ${s.f2.champs.length ? `<div class="card"><h3>F2 歴代王者</h3>${s.f2.champs.map(c => `<div class="small">第${c.season}シーズン：${esc(c.name)}${F1.teamOf(c.id) ? "（今は " + esc(F1.teamOf(c.id).short) + "）" : ""}</div>`).join("")}</div>` : ""}`;
  } else if (sub === "staff") {
    const stCard = (st, kind) => `<div class="card"><h3>${kind === "strat" ? "戦略担当" : "ピットクルー責任者"}</h3><div class="row"><b class="sp">${esc(st.name)}</b><span>腕 <b>${st.skill}</b></span><span class="small muted">年俸${money(st.salary)}</span></div><p class="hint">${kind === "strat" ? "腕が高いほど、レース前の「戦略担当の案」がズレにくく、セーフティカーへの反応も良い。" : "腕が高いほど、ピット作業が速く、作業ミスが少ない。"}</p></div>`;
    body = stCard(t.staff.strat, "strat") + stCard(t.staff.crew, "crew") + `<div class="card"><h3>引き抜ける人</h3><p class="small muted">雇うには年俸2年分の契約金がかかります。今の人と入れ替わります。</p>${s.staffPool.slice().sort((a, b) => b.skill - a.skill).map(st => `<div class="pick"><div class="sp"><b>${esc(st.name)}</b><div class="small muted">${st.kind === "strat" ? "戦略担当" : "ピットクルー"}・腕 ${st.skill}・年俸${money(st.salary)}</div></div><button class="b" data-hire="${st.id}">${money(st.salary * 2)} で雇う</button></div>`).join("")}</div>`;
  } else if (sub === "money") {
    const ly = t.lastYear, sal = t.drivers.reduce((a, id) => a + F1.drv(id).salary, 0) + t.staff.strat.salary + t.staff.crew.salary;
    body = `<div class="card"><h3>お金</h3><p>予算 <b>${money(t.budget)}</b>・今季の開発費 ${money(F1.spent(t))}（上限 ${money(s.regs.cap)}）</p><div class="small">オーナー資金 ${money(t.owner)}／年・スポンサー ${money(t.sponsor)}／年・給料 ${money(sal)}／年${t.works ? "" : "・PU代 " + money(F1.pu(t.pu).fee) + "／年"}</div><p class="hint">毎年、オーナー資金＋スポンサー＋賞金（順位）＋ペイドライバーの持ち込み＋残りの25%−給料−PU代が次の年の予算になります。スポンサーは順位が良いと増えます。レースごとにも少し賞金が入ります。</p>${ly ? `<p class="small muted">昨年：オーナー ${money(ly.owner)}＋スポンサー ${money(ly.sponsor)}＋賞金 ${money(ly.prize)}${ly.pay ? "＋持ち込み " + money(ly.pay) : ""}＋繰り越し ${money(ly.carry)}−給料 ${money(ly.sal)}${ly.fee ? "−PU代 " + money(ly.fee) : ""}</p>` : ""}</div>`;
  } else {
    body = `<div class="card"><h3>チーム名・カラー</h3><div class="row"><input type="text" id="tn" value="${esc(t.name)}" class="sp"><button class="b" id="tnb">変える</button></div><div class="row" style="margin-top:8px"><span class="small">メイン</span><input type="color" id="c1" value="${esc(t.color)}"><span class="small">サブ</span><input type="color" id="c2" value="${esc(t.color2)}"><button class="b" id="cb">色を変える</button></div>
      <p class="hint">ドライバー・ほかのチームの名前も変えられます：</p><div class="row"><select id="rnsel">${s.teams.map(x => `<option value="t${x.id}">${esc(x.name)}（チーム）</option>`).join("")}${Object.values(s.drivers).filter(d => F1.teamOf(d.id) || s.free.includes(d.id)).map(d => `<option value="d${d.id}">${esc(d.name)}</option>`).join("")}</select><input type="text" id="rnv" placeholder="新しい名前" class="sp"><button class="b" id="rnb">変える</button></div></div>
      <div class="card"><h3>セーブ</h3><p class="small muted">進み具合はこの端末のブラウザに自動で保存されます。別の端末に移すときは書き出してください。</p><div class="row"><button class="b" id="ex">セーブデータを書き出す</button><button class="b" id="restart">最初からやり直す</button></div><textarea id="exo" style="width:100%;height:70px;margin-top:8px;display:none" readonly></textarea></div>
      <div class="card"><h3>コツ</h3><ul class="small muted" style="margin:0;padding-left:1.2em"><li>ソフトは速いが減りが早い。崖の前に替えるのが基本。セーフティカー中はピットの損失が半分。</li><li>燃料「少なめ」は序盤が速いぶん、後半に燃料セーブが要る。SC 中は燃料が減りにくいので取り返せることも。</li><li>冷静さの低いドライバーは、詰まったり抜かれたりした後にミスしやすい。「攻める」を長く続けない。</li><li>大きな規則変更が予告されたら、どの時点で来年の車に開発を振るかが勝負。</li></ul></div>`;
  }
  $("#main").innerHTML = seg + body;
  document.querySelectorAll("[data-tm]").forEach(b => b.onclick = () => { U.sub.tm = b.dataset.tm; render(); });
  document.querySelectorAll("[data-sw]").forEach(sel => sel.onchange = () => { if (!sel.value) return; if (S().race) { toast("レース週末中は入れ替えできません"); render(); return; } const r = F1.swapDriver(+sel.value, +sel.dataset.sw); toast(r.msg); render(); });
  document.querySelectorAll("[data-hire]").forEach(b => b.onclick = () => { const r = F1.hireStaff(+b.dataset.hire); toast(r.msg); render(); });
  document.querySelectorAll("[data-ja]").forEach(b => b.onclick = () => { const r = F1.joinAcademy(+b.dataset.ja); toast(r.msg); render(); });
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { const r = F1.leaveAcademy(+b.dataset.lv); toast(r.msg); render(); });
  document.querySelectorAll("[data-pro]").forEach(sel => sel.onchange = () => { if (!sel.value) return; const r = F1.promote(+sel.value, +sel.dataset.pro); toast(r.msg); render(); });
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("tnb", () => { const v = $("#tn").value.trim(); if (v) { t.name = v.slice(0, 24); F1.save(); render(); } });
  on("cb", () => { t.color = $("#c1").value; t.color2 = $("#c2").value; F1.save(); render(); });
  on("rnb", () => { const v = $("#rnv").value.trim(), k = $("#rnsel").value; if (!v) return; if (k[0] === "t") F1.team(+k.slice(1)).name = v.slice(0, 24); else F1.drv(+k.slice(1)).name = v.slice(0, 24); F1.save(); render(); toast("名前を変えました"); });
  on("ex", () => { const x = $("#exo"); x.style.display = ""; x.value = F1.exportSave(); x.select(); try { navigator.clipboard.writeText(x.value); toast("コピーしました"); } catch (e) { } });
  on("restart", () => { if (confirm("今のセーブを消して最初からやり直しますか？（元に戻せません）")) { F1.wipe(); startScreen(); } });
}

/* ---------- 順位 ---------- */
function vTable() {
  const sub = U.sub.tb || "drv", s = S();
  const seg = `<div class="seg">${[["drv", "ドライバー"], ["con", "コンストラクター"], ["cal", "カレンダー"], ["hist", "歴代"]].map(([k, l]) => `<button class="${sub === k ? "on" : ""}" data-tb="${k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (sub === "drv") body = `<div class="card"><table><tr><th>#</th><th>ドライバー</th><th class="n">勝</th><th class="n">点</th></tr>${F1.driverTable().map((d, i) => { const tm = F1.teamOf(d.id); return `<tr class="${tm.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(tm)}${esc(d.name)}</td><td class="n">${d.wins}</td><td class="n"><b>${d.pts}</b></td></tr>`; }).join("")}</table></div>`;
  else if (sub === "con") body = `<div class="card"><table><tr><th>#</th><th>チーム</th><th class="n">点</th></tr>${F1.teamTable().map((t, i) => `<tr class="${t.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(t)}${esc(t.name)}</td><td class="n"><b>${t.pts}</b></td></tr>`).join("")}</table></div>`;
  else if (sub === "cal") body = `<div class="card"><table>${s.calendar.map((tid, i) => { const tr = F1.TRACKS[tid], r = (s.results || []).find(x => x.round === i + 1); return `<tr class="${i === s.round ? "me" : ""}"><td>${i + 1}</td><td>${esc(tr.name)}</td><td class="small">${r ? "優勝 " + esc(r.winner) : i === s.round ? "次" : ""}</td></tr>`; }).join("")}</table></div>`;
  else body = `<div class="card">${s.history.slice().reverse().map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>第${h.season}シーズン</b><div class="small muted">王者 ${esc(h.champ)}（${esc(h.champTeam)}）・コンストラクター ${esc(h.cons)}・${esc(h.my)} ${h.myRank}位（${h.myPts}点）${h.reg ? "・翌年から " + esc(h.reg) : ""}</div></div>`).join("") || '<p class="muted small">まだ記録がありません</p>'}</div>`;
  $("#main").innerHTML = seg + body;
  document.querySelectorAll("[data-tb]").forEach(b => b.onclick = () => { U.sub.tb = b.dataset.tb; render(); });
}

/* 表示テーマ：ダーク（最初）→ ライト → 端末に合わせる。上の帯のボタンで切り替え */
(function () {
  const KEY = "f1_theme", ORDER = ["dark", "light", "auto"], ICON = { dark: "🌙", light: "☀", auto: "🌓" }, LABEL = { dark: "ダーク", light: "ライト", auto: "端末に合わせる" };
  let cur = "dark"; try { cur = localStorage.getItem(KEY) || "dark"; } catch (e) { }
  const apply = () => { if (cur === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", cur); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", "#0b0d12"); };
  apply();
  const addBtn = () => { const hd = document.getElementById("hd"); if (!hd || document.getElementById("thm")) return; const b = document.createElement("button"); b.id = "thm"; b.type = "button"; b.title = "表示：" + LABEL[cur]; b.textContent = ICON[cur]; b.style.cssText = "background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;width:34px;height:34px;font-size:17px;flex:none;margin-left:4px"; b.onclick = () => { cur = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]; try { localStorage.setItem(KEY, cur); } catch (e) { } apply(); b.textContent = ICON[cur]; b.title = "表示：" + LABEL[cur]; if (typeof toast === "function") toast("表示：" + LABEL[cur]); if (typeof render === "function" && window.__themeRerender) window.__themeRerender(); }; hd.appendChild(b); };
  const start = () => { addBtn(); const hd = document.getElementById("hd"); if (hd) new MutationObserver(addBtn).observe(hd, { childList: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
window.__themeRerender = () => { if (typeof drawTrack === "function" && typeof S === "function" && S() && S().race) drawTrack(); };
boot();

</script>
</body>
</html>
