<title>F1チーム監督</title>

table { width:100%; border-collapse:collapse; font-size:13px; }

const tbar = tm => `<span class="tbar" style="background:${esc(tm.color)}"></span>`;
const stars = (v, lo, hi) => { const n = Math.max(1, Math.min(5, Math.round((v - lo) / (hi - lo) * 4) + 1)); return `<span class="stars">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>`; };
const tags = d => F1.traits(d).map(t => `<span class="tag ${/カッと/.test(t) ? "warn" : /完全/.test(t) ? "gold" : ""}">${esc(t)}</span>`).join("");
function modal(html, noClose) { closeModal(); const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = `<div class="sheet">${html}</div>`; m.onclick = e => { if ((!noClose && e.target === m) || e.target.hasAttribute("data-x")) closeModal(); }; document.body.appendChild(m); }

const rk = (v, unk) => `<span class="rk rk-${RK(v)}">${RK(v)}</span><b>${unk ? v + "?" : v}</b>`;

const SOUTH = ["aus", "bra", "arg", "zaf", "nzl"];
const seasonOf = (m, c) => { const x = SOUTH.includes(c) ? (m + 5) % 12 + 1 : m; return x >= 3 && x <= 5 ? "春" : x <= 8 && x >= 6 ? "夏" : x >= 9 && x <= 11 ? "秋" : "冬"; };
const ATTR = [["pace", "速さ"], ["craft", "バトル"], ["cons", "安定感"], ["tm", "タイヤ管理"], ["wet", "雨"], ["dev", "開発"], ["adapt", "規則変更"], ["calm", "冷静さ"]];
const attrGrid = d => `<div class="ag">${ATTR.map(([k, l]) => `<div><span>${l}</span><span>${rk(d[k])}</span></div>`).join("")}</div>`;
const teamKind = tm => tm.works ? `ワークス（${esc(F1.pu(tm.pu).name)} PU を自社開発）` : `カスタマー（${esc(F1.pu(tm.pu).name)} PU を購入 年${money(F1.pu(tm.pu).fee)}）`;

/* ---------- 起動 ---------- */
function boot() { if (F1.load()) { const p = S().phase; if (S().my == null) chooseMode(); else if (p === "drivers") pickDrivers(); else render(); } else startScreen(); }

  $("#main").innerHTML = `<div class="card"><h3>新しく始める</h3><p class="small muted">実在のF1に寄せた11チームのシリーズ（全16戦）。既存チームを率いるか、新規参入チームを作るかを選び、ドライバーを選んで、何シーズンも戦います。時代ごとに規則が変わり、勢力図が動きます。</p><button class="b p big" id="ng">シリーズを作る</button></div>
  <div class="card"><h3>セーブデータを読み込む</h3><textarea id="imp" style="width:100%;height:70px" placeholder="書き出したセーブデータを貼り付け"></textarea><button class="b" id="impb">読み込む</button></div>`;
  $("#ng").onclick = () => { F1.newGame(); chooseMode(); };
  $("#impb").onclick = () => { if (F1.load($("#imp").value.trim())) { F1.save(); boot(); toast("読み込みました"); } else toast("読み込めませんでした（旧版のセーブは使えません）"); };
}
function chooseMode() {

  <div class="card"><h3>新規参入チームを作る</h3><p class="small muted">12チーム目として参戦。名前と色、エンジン（PU）の供給元を選ぶ。マシンも開発力も最初は低めだが、予算はそこそこある。</p><button class="b big" id="mNew">新規参入する</button></div>`;

    <div class="small muted" style="margin:4px 0">${teamKind(t)}</div>
    <div class="ag">
      <div><span>マシンの速さ</span>${stars(F1.carPace(t, tr), Math.min(...all), Math.max(...all))}</div>
      <div><span>開発力（車体）</span>${stars(t.devp, 50, 90)}</div>

  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (U.tab === "race" && b.dataset.tab !== "race") pauseRace(); U.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  ({ home: vHome, race: vRace, car: vCar, team: vTeam, table: vTable })[U.tab]();

function trackFeat(tr) {
  const f = [], w = tr.wear * S().regs.wear;
  if (tr.pw >= 0.65) f.push("長い直線（PU・ストレート）"); else if (tr.pw <= 0.3) f.push("曲がりが多い（ダウンフォース）");
  if (tr.hs >= 0.65) f.push("高速コーナー多め"); else if (tr.hs <= 0.3) f.push("低速コーナー多め");
  if (tr.street) f.push("市街地・壁が近い"); if (tr.ovt <= 0.3) f.push("抜きにくい"); else if (tr.ovt >= 0.65) f.push("抜きやすい");
  if (w >= 1.1) f.push("タイヤに厳しい"); if (tr.temp >= 29) f.push("暑い"); if (tr.sc >= 0.015) f.push("SCが出やすい"); if (tr.rain >= 0.3) f.push("雨が多い"); if (tr.fuel >= 1.08) f.push("燃料が厳しい");
  return f.map(x => `<span class="tag">${x}</span>`).join("");
}
function gpCard(tr, round) {
  const t = ME(), g = S().gp[tr.id] || {}, fv = S().nations[tr.c] ? S().nations[tr.c].fever : 50;
  const home = []; if (t.nat === tr.c) home.push("ホームGP：チーム全体に気合い（ピット作業も速い）"); if (t.fac === tr.c) home.push("工場が近い：届く予定の新パーツが1戦早く間に合う");
  t.drivers.forEach(id => { const d = F1.drv(id); if (d.nat === tr.c) home.push(`地元ドライバー ${esc(d.name)}：大声援で速くなる${d.calm < 50 ? "（冷静さが低いので重圧でミスも増える）" : ""}`); });
  return `<div class="row"><h3 class="sp">第${round + 1}戦　${esc(tr.name)}</h3>${nb(tr.c)}</div>
    <div class="gp">${trackSvg(tr)}<div class="small">${esc(F1.natName(tr.c))}・${tr.month}月（${seasonOf(tr.month, tr.c)}）・気温 約${tr.temp}℃<br>${tr.street ? "市街地コース" : "常設サーキット"}・${g.isNew ? "<b>新規開催</b>" : "契約 あと" + (g.left || "?") + "年"}<br>${esc(F1.natName(tr.c))}のF1熱 ${rk(fv)}</div></div>
    <div style="margin-top:6px">${trackFeat(tr)}</div>${home.map(x => `<div class="small"><span class="tag gold">ホーム</span>${x}</div>`).join("")}${trackInfo(tr)}`;
}
function trackInfo(tr) {

const fpDone = () => { const w = S().wk; return !!(w && w.done && w.round === S().round && w.season === S().season); };

  } else if (sub === "money") {
    const ly = t.lastYear, sal = t.drivers.reduce((a, id) => a + F1.drv(id).salary, 0) + t.staff.strat.salary + t.staff.crew.salary;
    body = `<div class="card"><h3>お金</h3><p>予算 <b>${money(t.budget)}</b>・今季の開発費 ${money(F1.spent(t))}（上限 ${money(s.regs.cap)}）</p><div class="small">オーナー資金 ${money(t.owner)}／年・スポンサー ${money(t.sponsor)}／年・給料 ${money(sal)}／年${t.works ? "" : "・PU代 " + money(F1.pu(t.pu).fee) + "／年"}</div><p class="hint">毎年、オーナー資金＋スポンサー＋賞金（順位）＋ペイドライバーの持ち込み＋残りの25%−給料−PU代が次の年の予算になります。スポンサーは順位が良いと増えます。レースごとにも少し賞金が入ります。</p>${ly ? `<p class="small muted">昨年：オーナー ${money(ly.owner)}＋スポンサー ${money(ly.sponsor)}＋賞金 ${money(ly.prize)}${ly.pay ? "＋持ち込み " + money(ly.pay) : ""}＋繰り越し ${money(ly.carry)}−給料 ${money(ly.sal)}${ly.fee ? "−PU代 " + money(ly.fee) : ""}</p>` : ""}</div>`;
  } else {
    body = `<div class="card"><h3>チーム名・カラー</h3><div class="row"><input type="text" id="tn" value="${esc(t.name)}" class="sp"><button class="b" id="tnb">変える</button></div><div class="row" style="margin-top:8px"><span class="small">メイン</span><input type="color" id="c1" value="${esc(t.color)}"><span class="small">サブ</span><input type="color" id="c2" value="${esc(t.color2)}"><button class="b" id="cb">色を変える</button></div>
      <p class="hint">ドライバー・ほかのチームの名前も変えられます：</p><div class="row"><select id="rnsel">${s.teams.map(x => `<option value="t${x.id}">${esc(x.name)}（チーム）</option>`).join("")}${Object.values(s.drivers).filter(d => F1.teamOf(d.id) || s.free.includes(d.id)).map(d => `<option value="d${d.id}">${esc(d.name)}</option>`).join("")}</select><input type="text" id="rnv" placeholder="新しい名前" class="sp"><button class="b" id="rnb">変える</button></div></div>
      <div class="card"><h3>セーブ</h3><p class="small muted">進み具合はこの端末のブラウザに自動で保存されます。別の端末に移すときは書き出してください。</p><div class="row"><button class="b" id="ex">セーブデータを書き出す</button><button class="b" id="restart">最初からやり直す</button></div><textarea id="exo" style="width:100%;height:70px;margin-top:8px;display:none" readonly></textarea></div>
      <div class="card"><h3>コツ</h3><ul class="small muted" style="margin:0;padding-left:1.2em"><li>ソフトは速いが減りが早い。崖の前に替えるのが基本。セーフティカー中はピットの損失が半分。</li><li>燃料「少なめ」は序盤が速いぶん、後半に燃料セーブが要る。SC 中は燃料が減りにくいので取り返せることも。</li><li>冷静さの低いドライバーは、詰まったり抜かれたりした後にミスしやすい。「攻める」を長く続けない。</li><li>大きな規則変更が予告されたら、どの時点で来年の車に開発を振るかが勝負。</li></ul></div>`;
  }
  $("#main").innerHTML = seg + body;
  document.querySelectorAll("[data-tm]").forEach(b => b.onclick = () => { U.sub.tm = b.dataset.tm; render(); });
  document.querySelectorAll("[data-sw]").forEach(sel => sel.onchange = () => { if (!sel.value) return; if (S().race) { toast("レース週末中は入れ替えできません"); render(); return; } const r = F1.swapDriver(+sel.value, +sel.dataset.sw); toast(r.msg); render(); });
  document.querySelectorAll("[data-hire]").forEach(b => b.onclick = () => { const r = F1.hireStaff(+b.dataset.hire); toast(r.msg); render(); });
  document.querySelectorAll("[data-ja]").forEach(b => b.onclick = () => { const r = F1.joinAcademy(+b.dataset.ja); toast(r.msg); render(); });
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { const r = F1.leaveAcademy(+b.dataset.lv); toast(r.msg); render(); });
  document.querySelectorAll("[data-pro]").forEach(sel => sel.onchange = () => { if (!sel.value) return; const r = F1.promote(+sel.value, +sel.dataset.pro); toast(r.msg); render(); });
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("tnb", () => { const v = $("#tn").value.trim(); if (v) { t.name = v.slice(0, 24); F1.save(); render(); } });
  on("cb", () => { t.color = $("#c1").value; t.color2 = $("#c2").value; F1.save(); render(); });
  on("rnb", () => { const v = $("#rnv").value.trim(), k = $("#rnsel").value; if (!v) return; if (k[0] === "t") F1.team(+k.slice(1)).name = v.slice(0, 24); else F1.drv(+k.slice(1)).name = v.slice(0, 24); F1.save(); render(); toast("名前を変えました"); });
  on("ex", () => { const x = $("#exo"); x.style.display = ""; x.value = F1.exportSave(); x.select(); try { navigator.clipboard.writeText(x.value); toast("コピーしました"); } catch (e) { } });
  on("restart", () => { if (confirm("今のセーブを消して最初からやり直しますか？（元に戻せません）")) { F1.wipe(); startScreen(); } });
}

/* ---------- 順位 ---------- */
function vTable() {
  const sub = U.sub.tb || "drv", s = S();
  const seg = `<div class="seg">${[["drv", "ドライバー"], ["con", "コンストラクター"], ["cal", "カレンダー"], ["nat", "国"], ["hist", "歴代"]].map(([k, l]) => `<button class="${sub === k ? "on" : ""}" data-tb="${k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (sub === "drv") body = `<div class="card"><table><tr><th>#</th><th>ドライバー</th><th class="n">勝</th><th class="n">点</th></tr>${F1.driverTable().map((d, i) => { const tm = F1.teamOf(d.id); return `<tr class="${tm.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(tm)}${esc(d.name)}</td><td class="n">${d.wins}</td><td class="n"><b>${d.pts}</b></td></tr>`; }).join("")}</table></div>`;
  else if (sub === "con") body = `<div class="card"><table><tr><th>#</th><th>チーム</th><th class="n">点</th></tr>${F1.teamTable().map((t, i) => `<tr class="${t.id === s.my ? "me" : ""}"><td>${i + 1}</td><td>${tbar(t)}${esc(t.name)}</td><td class="n"><b>${t.pts}</b></td></tr>`).join("")}</table></div>`;
  else if (sub === "nat") { const tm = s.teams, dr = Object.values(s.drivers).filter(d => F1.teamOf(d.id)), host = s.calendar.map(id => F1.TRACKS[id].c);
    body = `<div class="card"><h3>国ごとのF1熱</h3><p class="hint">その国のドライバーやチームが活躍する、GPを開催する、地元で勝つと上がる。熱が低いとGPの契約が更新されにくく、熱の高い国が新しくGPを開く。チームの国の熱はスポンサー集めにも効く。</p><div style="overflow-x:auto"><table><tr><th>国</th><th class="n">F1熱</th><th>GP</th><th>チーム・ドライバー</th></tr>${Object.keys(s.nations).sort((a, b) => s.nations[b].fever - s.nations[a].fever).map(c => `<tr class="${ME().nat === c ? "me" : ""}"><td>${nb(c)}${esc(F1.natName(c))}</td><td class="n">${rk(s.nations[c].fever)}</td><td>${host.includes(c) ? "開催" : ""}</td><td class="small">${tm.filter(x => x.nat === c).map(x => esc(x.short)).concat(dr.filter(d => d.nat === c).map(d => esc(d.name))).join("・")}</td></tr>`).join("")}</table></div></div>`; }
  else if (sub === "cal") body = `<div class="card"><table>${s.calendar.map((tid, i) => { const tr = F1.TRACKS[tid], r = (s.results || []).find(x => x.round === i + 1); const g = s.gp[tid] || {}; return `<tr class="${i === s.round ? "me" : ""}"><td>${i + 1}</td><td>${nb(tr.c)}${esc(tr.name)}<div class="small muted">${tr.month}月・${g.isNew ? "新規開催" : "契約あと" + g.left + "年"}</div></td><td class="small">${r ? "優勝 " + esc(r.winner) : i === s.round ? "次" : ""}</td></tr>`; }).join("")}</table></div>`;
  else body = `<div class="card">${s.history.slice().reverse().map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>第${h.season}シーズン</b><div class="small muted">王者 ${esc(h.champ)}（${esc(h.champTeam)}）・コンストラクター ${esc(h.cons)}・${esc(h.my)} ${h.myRank}位（${h.myPts}点）${h.reg ? "・翌年から " + esc(h.reg) : ""}</div></div>`).join("") || '<p class="muted small">まだ記録がありません</p>'}</div>`;
  $("#main").innerHTML = seg + body;
  document.querySelectorAll("[data-tb]").forEach(b => b.onclick = () => { U.sub.tb = b.dataset.tb; render(); });
}

/* 表示テーマ：ダーク（最初）→ ライト → 端末に合わせる。上の帯のボタンで切り替え */
(function () {
  const KEY = "f1_theme", ORDER = ["dark", "light", "auto"], ICON = { dark: "🌙", light: "☀", auto: "🌓" }, LABEL = { dark: "ダーク", light: "ライト", auto: "端末に合わせる" };
  let cur = "dark"; try { cur = localStorage.getItem(KEY) || "dark"; } catch (e) { }
  const apply = () => { if (cur === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", cur); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", "#0b0d12"); };
  apply();
  const addBtn = () => { const hd = document.getElementById("hd"); if (!hd || document.getElementById("thm")) return; const b = document.createElement("button"); b.id = "thm"; b.type = "button"; b.title = "表示：" + LABEL[cur]; b.textContent = ICON[cur]; b.style.cssText = "background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;width:34px;height:34px;font-size:17px;flex:none;margin-left:4px"; b.onclick = () => { cur = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]; try { localStorage.setItem(KEY, cur); } catch (e) { } apply(); b.textContent = ICON[cur]; b.title = "表示：" + LABEL[cur]; if (typeof toast === "function") toast("表示：" + LABEL[cur]); if (typeof render === "function" && window.__themeRerender) window.__themeRerender(); }; hd.appendChild(b); };
  const start = () => { addBtn(); const hd = document.getElementById("hd"); if (hd) new MutationObserver(addBtn).observe(hd, { childList: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
window.__themeRerender = () => { if (typeof drawTrack === "function" && typeof S === "function" && S() && S().race) drawTrack(); };
boot();

</script>
</body>
</html>
